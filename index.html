<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTR &amp; Payroll · Prime Laundry · TSL Corporation · Prime CBL</title>
<meta name="description" content="DTR and payroll for Prime Laundry, TSL Corporation and Prime CBL: attendance import, department approvals, payroll cut-offs and BIR reports.">
<meta name="theme-color" content="#0f2d38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DTR Payroll">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f6f8f8; --ink:#17262e; --muted:#5b6a72; --line:#d9e1df;
  --accent:#0a6a86; --accent-soft:#e1f0f4; --on-accent:#ffffff;
  --ok:#1b7148; --ok-soft:#e2f3ea; --warn:#9a5a00; --warn-soft:#fbf0dc; --bad:#ad2a22; --bad-soft:#fbe7e5;
  --head:#0f2d38; --on-head:#eaf4f6;
  --radius:10px; --radius-sm:6px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--bg);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1619; --surface:#152025; --surface-2:#1a272d; --ink:#e3ecee; --muted:#93a4ab; --line:#26363d;
    --accent:#4db3d0; --accent-soft:#163846; --on-accent:#06212b;
    --ok:#5fca93; --ok-soft:#173528; --warn:#e7ab4f; --warn-soft:#3a2c14; --bad:#f07c72; --bad-soft:#3d1c1a;
    --head:#0a1c23; --on-head:#dcebef;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#152025; --surface-2:#1a272d; --ink:#e3ecee; --muted:#93a4ab; --line:#26363d;
  --accent:#4db3d0; --accent-soft:#163846; --on-accent:#06212b;
  --ok:#5fca93; --ok-soft:#173528; --warn:#e7ab4f; --warn-soft:#3a2c14; --bad:#f07c72; --bad-soft:#3d1c1a;
  --head:#0a1c23; --on-head:#dcebef;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);min-height:100%;line-height:1.45;font-size:15px}
.num,td.n,.money{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{background:var(--head);color:var(--on-head);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-inner{max-width:1240px;margin:0 auto;padding:12px 18px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12.5px;opacity:.7}
.brand .co-label{font-size:11.5px;opacity:.7}
.brand .co-sel{background:transparent;color:var(--on-head);border:1px solid rgba(255,255,255,.28);border-radius:var(--radius-sm);padding:5px 28px 5px 10px;font-weight:800;font-size:16px;max-width:min(420px,80vw);appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.brand .co-sel:hover{background-color:rgba(255,255,255,.08)}
.brand .co-sel option{color:#17262e}
.co-pick{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin:14px 0 0}
.co-pick legend{font-weight:700;font-size:13px;padding:0 4px}
.co-pick .chk{margin:4px 18px 4px 0;display:inline-flex}
.period{display:flex;flex-direction:column;gap:2px}
.period .plabel{font-size:11.5px;opacity:.7}
.mp{position:relative;display:flex;align-items:stretch;border:1px solid rgba(255,255,255,.28);border-radius:var(--radius-sm)}
.mp button{background:transparent;color:var(--on-head);border:0;cursor:pointer;font:inherit}
.mp-nav{padding:6px 10px;font-size:18px;line-height:1}
.mp-nav:hover,.mp-btn:hover{background:rgba(255,255,255,.08)}
.mp-btn{padding:6px 12px;font-weight:700;font-size:15px;border-left:1px solid rgba(255,255,255,.18)!important;border-right:1px solid rgba(255,255,255,.18)!important;min-width:150px}
.mp-pop{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:12px;width:260px}
.mp-pop .yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mp-pop .yr b{font-size:16px}
.mp-pop .yr button,.mp-pop .mg button,.mp-pop .ft button{color:var(--ink);border-radius:var(--radius-sm)}
.mp-pop .yr button{padding:4px 10px;font-size:18px}
.mp-pop .mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mp-pop .mg button{padding:9px 0;font-weight:600;font-size:14px;border:1px solid var(--line)}
.mp-pop .mg button:hover,.mp-pop .yr button:hover{background:var(--surface-2)}
.mp-pop .mg button[aria-current="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mp-pop .mg button.now{box-shadow:inset 0 0 0 2px var(--accent)}
.mp-pop .ft{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}
.mp-pop .ft button{padding:5px 8px;color:var(--accent);font-weight:650}
.period select{background:transparent;color:var(--on-head);border:1px solid rgba(255,255,255,.28);border-radius:var(--radius-sm);padding:6px 28px 6px 10px;font-weight:700;font-size:15px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.period select option{color:#17262e}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who img{width:28px;height:28px;border-radius:50%}
.who small{display:block;opacity:.7;font-size:11.5px}
nav.tabs{max-width:1240px;margin:0 auto;padding:10px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--on-head);opacity:.72;text-decoration:none;padding:9px 12px 11px;font-size:14px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a:hover{opacity:1}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--accent)}
@media (prefers-color-scheme:light){nav.tabs a[aria-current="page"]{border-bottom-color:#5fc4df}}

main{max-width:1240px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:24px;letter-spacing:-.015em;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.banner{border-radius:var(--radius);padding:10px 14px;margin:0 0 16px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner .spacer{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.stat.hl{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 14px;font-weight:650;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 10px;min-width:0}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-weight:400;font-size:15px}
input.t24{font-variant-numeric:tabular-nums;letter-spacing:.02em}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid .wide{grid-column:1/-1}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;vertical-align:middle;white-space:nowrap}
th{background:var(--surface-2);font-weight:650;color:var(--muted);font-size:12.5px;position:sticky;top:0}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.bad td{background:var(--bad-soft)}
tfoot td{font-weight:750;background:var(--surface-2)}
.stick{position:sticky;left:0;background:var(--surface);z-index:1}
th.stick{background:var(--surface-2);z-index:2}

.chip{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* DTR list */
.daygroup{margin:0 0 14px}
.dayhead{font-size:13px;font-weight:700;color:var(--muted);padding:6px 2px}
.dtr{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.dtr-row{display:grid;grid-template-columns:minmax(160px,1.4fr) 110px 1.6fr 96px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.dtr-row:first-child{border-top:0}
.dtr-row:hover{background:var(--surface-2)}
.dtr-row .nm b{display:block;font-size:14px}
.dtr-row .nm span{font-size:12px;color:var(--muted)}
.dtr-row .tm{font-variant-numeric:tabular-nums;font-size:14px}
.dtr-row .chips{display:flex;gap:5px;flex-wrap:wrap}
.dtr-row .rv{text-align:right}
/* Select mode (delete several attendance records) */
.dtr-row.sel{grid-template-columns:28px minmax(160px,1.4fr) 110px 1.6fr 96px}
.dtr-row.sel.on{background:var(--accent-soft)}
.dtr-row.sel.lk{cursor:not-allowed;opacity:.6}
.dtr-row .pick{display:flex;align-items:center;justify-content:center}
.dtr-row .pick input,.imp-cb{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.selbar{position:sticky;top:64px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:8px 12px;margin:0 0 14px}
td.cb,th.cb{width:34px;text-align:center}
tr.unsel td{color:var(--muted)}
.editor{padding:14px;background:var(--surface-2);border-top:1px dashed var(--line)}
.editor .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
/* Skip link & offline banner */
.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:0 0 8px 0;font-weight:700}
.skip:focus{left:0}
.offline{background:var(--bad);color:#fff;text-align:center;font-size:13.5px;padding:6px 12px;font-weight:600}
/* Comfortable tap targets on touch screens */
@media (pointer:coarse){
  .btn,.seg button,select,input:not([type=checkbox]):not([type=radio]),.mp button,nav.tabs a{min-height:44px}
  .btn.sm{min-height:38px}
  input[type=checkbox]{width:22px;height:22px}
  label.chk{min-height:40px}
}
/* Phones */
@media (max-width:640px){
  body{font-size:15.5px}
  input,select,textarea{font-size:16px!important} /* stops iOS zooming into fields */
  h1{font-size:22px}
  .top-inner{flex-wrap:wrap;gap:8px 12px}
  .brand{order:1}
  .who{order:2;margin-left:auto;font-size:12px}
  .who small{display:none}
  .who .btn{padding:6px 9px}
  .period{order:3;flex-basis:100%}
  .mp{width:100%}.mp-btn{flex:1}
  .mp-pop{left:0;transform:none;width:min(300px,calc(100vw - 24px))}
  .stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:12px}.stat b{font-size:21px}
  .panel{padding:14px}
  .row>.spacer{display:none}
  .banner{flex-direction:column;align-items:stretch}
  dialog#dlg{max-width:100vw!important;width:100vw;height:100%;max-height:100%;margin:0;border-radius:0}
  dialog#cdlg{max-width:calc(100vw - 24px)!important}
  #dlg .dlg-body{max-height:calc(100% - 70px)!important;height:calc(100% - 70px)}
  .login-card{padding:22px 18px}
  /* Tables become stacked cards: each cell shows its column name */
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tfoot,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{padding:10px 14px;border-bottom:1px solid var(--line)}
  table.rt td{border:0;padding:3px 0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 14px;white-space:normal;text-align:right;position:static;overflow-wrap:anywhere}
  table.rt td::before{content:attr(data-label);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left;flex-shrink:0}
  table.rt td:not([data-label]),table.rt td[data-label=""]{justify-content:flex-end}
  table.rt td:not([data-label])::before,table.rt td[data-label=""]::before{content:none}
  table.rt td:empty{display:none}
  table.rt tfoot tr{background:var(--surface-2)}
}
/* Payroll cards (phones) */
.pcards{display:grid;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%;cursor:pointer;color:var(--ink);font:inherit}
.pcard:hover{background:var(--surface-2)}
.pcard .top-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .nm b{display:block}.pcard .nm span{font-size:12.5px;color:var(--muted)}
.pcard .net{text-align:right}.pcard .net b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.pcard .net span{font-size:12px;color:var(--muted)}
.pcard .fig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:13px}
.pcard .fig div span{display:block;color:var(--muted);font-size:11.5px}
.pcard .fig div b{font-variant-numeric:tabular-nums;font-weight:650}
@media (max-width:720px){
  .dtr-row{grid-template-columns:1fr auto;}
  .dtr-row .chips{grid-column:1/-1}
  .dtr-row .rv{grid-row:1;grid-column:2}
  .dtr-row .tm{grid-column:1}
  .dtr-row.sel{grid-template-columns:28px 1fr auto}
  .dtr-row.sel .pick{grid-row:1/span 3;grid-column:1}
  .dtr-row.sel .nm,.dtr-row.sel .tm{grid-column:2}
  .dtr-row.sel .chips{grid-column:2/-1}
  .dtr-row.sel .rv{grid-row:1;grid-column:3}
  .selbar{top:0}
  main{padding:16px 12px 60px}
  .top-inner{padding:10px 12px 0}
  .top{position:static}
}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.steps{margin:0;padding-left:20px}
.steps li{margin:4px 0}
.attn{list-style:none;padding:0;margin:0}
.attn li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.attn li:last-child{border-bottom:0}

.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius);font-size:14px;z-index:60;max-width:min(92vw,520px);box-shadow:0 8px 30px rgba(0,0,0,.25);display:none}
.toast.show{display:block}
.toast.bad{background:var(--bad);color:#fff}

dialog{border:0;border-radius:14px;padding:0;max-width:min(680px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,20,26,.55)}
.dlg-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.dlg-body{padding:18px;max-height:72vh;overflow:auto}
.slip table td,.slip table th{white-space:normal}
.slip .tot td{font-weight:800;border-top:2px solid var(--ink)}
.slip .net{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--radius)}
.slip .net b{font-size:24px;font-variant-numeric:tabular-nums}
.cd-num{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0}
.cd-big.late,[data-deadline].late{color:var(--bad)}
.cd-card{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.cd-card.cd-late{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.cd-pend b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.cd-pend span{color:var(--muted);font-size:13px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
body.signed-out .top .period,body.signed-out .top .who,body.signed-out nav.tabs{display:none}
.login-wrap{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:20px 0}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
.login-card h1{font-size:22px}
.login-card form{display:grid;gap:14px;margin-top:16px}
.login-card .pw{display:flex;gap:6px}.login-card .pw input{flex:1}
.login-err{background:var(--bad-soft);color:var(--bad);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px}
.who .btn{background:transparent;color:var(--on-head);border-color:rgba(255,255,255,.28)}
.who .btn:hover{background:rgba(255,255,255,.08)}

@media print{
  body *{visibility:hidden}
  dialog[open],dialog[open] *{visibility:visible}
  dialog[open]{position:absolute;inset:0;max-width:none;box-shadow:none}
  .noprint{display:none!important}
  .dlg-body{max-height:none}
}

const CAN={

/* ---------------- Utilities ---------------- */
const $=s=>document.querySelector(s);

const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD=s=>{const[y,m,d]=s.split('-').map(Number);return `${MON[m-1]} ${d}`};
const fmtDY=s=>{const[y,m,d]=s.split('-').map(Number);return `${MON[m-1]} ${d}, ${y}`};
const fmtPeriod=p=>{const sy=p.start.slice(0,4),ey=p.end.slice(0,4);return sy===ey?`${fmtD(p.start)} – ${fmtD(p.end)}, ${ey}`:`${fmtDY(p.start)} – ${fmtDY(p.end)}`};
const peso=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=n=>(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMin=m=>{m=Math.round(m||0);if(m<60)return m+'m';const hh=Math.floor(m/60),mm=m%60;return mm?`${hh}h ${mm}m`:`${hh}h`};

const fmtStamp=s=>{if(!s)return'';const d=new Date(s);return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const empName=e=>e?`${e.surname}, ${e.first_name}`:'Unknown employee';

/* Payroll month M: 1st cut-off is paid M 1–15 for attendance (M-1) 26 – M 10;
   2nd cut-off is paid M 16–30/31 for attendance M 11 – M 25. Monthly = both together. */
const fmtMonth=ym=>{const[y,m]=ym.split('-').map(Number);return `${['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]} ${y}`};
function monthPeriods(ym){
  const st=S.settings, cs=Number(st.cutoff_day)||26, mid=Number(st.cut1_end)||10;
  const[y,m]=ym.split('-').map(Number); const py=m===1?y-1:y, pm=m===1?12:m-1, last=daysIn(y,m);
  const start=iso(py,pm,Math.min(cs,daysIn(py,pm)));
  const c1End=iso(y,m,Math.min(mid,last)), end=addDays(iso(y,m,Math.min(cs,last)),-1);
  return {ym,start,end,cuts:[
    {n:1,start,end:c1End,payStart:iso(y,m,1),payEnd:iso(y,m,15),key:ym+'_1'},
    {n:2,start:addDays(c1End,1),end,payStart:iso(y,m,16),payEnd:iso(y,m,last),key:ym+'_2'}]};
}
function payMonthFor(dateStr){
  const cs=Number(S.settings.cutoff_day)||26;const[y,m,d]=dateStr.split('-').map(Number);
  if(d<cs)return `${y}-${pad(m)}`;return m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;
}
function cutoffFor(dateStr){const P=monthPeriods(payMonthFor(dateStr));return P.cuts.find(c=>dateStr>=c.start&&dateStr<=c.end)||P.cuts[1]}
function monthList(){
  const out=[];let ym=payMonthFor(todayISO());const[y,m]=ym.split('-').map(Number);
  let yy=m===12?y+1:y,mm=m===12?1:m+1;
  for(let i=0;i<15;i++){out.push(`${yy}-${pad(mm)}`);mm--;if(mm<1){mm=12;yy--}}
  return out;
}
const fmtRange=(a,b)=>`${fmtD(a)} – ${fmtDY(b)}`;
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtLong(a,b){const[ay,am,ad]=a.split('-').map(Number),[by,bm,bd]=b.split('-').map(Number);
  if(ay===by&&am===bm)return `${MF[am-1]} ${ad}–${bd}, ${by}`;if(ay===by)return `${MF[am-1]} ${ad} – ${MF[bm-1]} ${bd}, ${by}`;return `${MF[am-1]} ${ad}, ${ay} – ${MF[bm-1]} ${bd}, ${by}`}
const shiftMonth=(ym,n)=>{let[y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}`};
/* The cut-off currently being processed: the first one whose payday is today or later. */
function activeCut(){const t=todayISO(),ym=payMonthFor(t);for(const m of[shiftMonth(ym,-1),ym,shiftMonth(ym,1)])for(const c of monthPeriods(m).cuts)if(c.payEnd>=t)return{...c,ym:m};const c=monthPeriods(ym).cuts[1];return{...c,ym}}
const fmtDT=iso=>{if(!iso)return'';const d=new Date(iso);return `${WD[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function leftText(ms){const neg=ms<0,a=Math.abs(ms),hh=Math.floor(a/3600000),mm=Math.floor(a%3600000/60000);const t=`${hh} ${hh===1?'hour':'hours'} ${mm} min`+(hh>=48?` (about ${Math.floor(hh/24)} days)`:'');return neg?`${t} overdue`:`${t} left`}
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000);

/* ---------------- Time & date parsing (imports) ---------------- */
function parseTime(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){const frac=v-Math.floor(v);const mins=Math.round(frac*1440)%1440;return pad(Math.floor(mins/60))+':'+pad(mins%60)}
  const s=String(v).trim().toUpperCase(); if(!s)return null;
  let m=s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|A\.M\.|P\.M\.|A|P)?/);
  let hh,mm,ap;
  if(m){hh=+m[1];mm=+m[2];ap=m[3]}
  else{m=s.match(/^(\d{1,2})(\d{2})\s*(AM|PM)?$/);if(!m)return null;hh=+m[1];mm=+m[2];ap=m[3]}
  if(ap){if(ap[0]==='P'&&hh<12)hh+=12;if(ap[0]==='A'&&hh===12)hh=0}
  if(hh>23||mm>59)return null;

}
function parseDate(v){
  if(v==null||v==='')return null;
  const ok=(y,m,d)=>(y>1990&&y<2100&&m>=1&&m<=12&&d>=1&&d<=daysIn(y,m))?iso(y,m,d):null;
  if(typeof v==='number'){if(v<20000)return null;const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*86400000);return d.toISOString().slice(0,10)}
  const s=String(v).replace(/[\u00a0\u200b\ufeff"']/g,' ').trim();
  let m=s.match(/(?:^|\D)(\d{4})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})(?!\d)/); if(m)return ok(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if(m){let y=+m[3];if(y<100)y+=2000;return ok(y,+m[1],+m[2])}
  const t=Date.parse(s); if(!isNaN(t)){const d=new Date(t);return ok(d.getFullYear(),d.getMonth()+1,d.getDate())}

}
/* Pasted DTR. The header row is kept and recognised; if there is no header,
   columns are read in order (Employee ID optional), First Name, Date, Time In, Time Out.
   Rows are anchored on the yyyy-mm-dd date, so space-separated text also works. */
const PASTE_HEADER='First Name\tDate\tTime In\tTime Out';
const DATE_RE=/\d{4}\s*[-\/.]\s*\d{1,2}\s*[-\/.]\s*\d{1,2}/;
function parsePasted(text,anchorOnly){
  text=String(text||'').replace(/^\ufeff/,'').replace(/\u00a0/g,' ').replace(/\r/g,'');
  const all=text.split('\n').filter(l=>l.trim());
  // Keep one header row (the last one, e.g. a pasted header under the pre-filled one) followed by the data rows.
  const isHeaderish=l=>!DATE_RE.test(l)&&/name|date|time|in\b|out\b/i.test(l);
  const hdrs=all.filter(isHeaderish), data=all.filter(l=>!isHeaderish(l));
  const lines=hdrs.length?[hdrs[hdrs.length-1],...data]:data;
  if(!lines.length)return[];
  const first=lines[0], delim=first.includes('\t')?'\t':(first.includes(',')?',':(first.includes(';')?';':null));
  const firstHasDate=DATE_RE.test(first);
  if(!anchorOnly&&delim&&!firstHasDate&&lines.slice(1).some(l=>l.includes(delim)))return parseDelimited(lines.join('\n'));
  const out=[];
  for(const line of lines){
    const dm=line.match(DATE_RE);
    if(!dm)continue; // header row or a note line
    let before=line.slice(0,dm.index), after=line.slice(dm.index+dm[0].length);
    if(delim){before=before.split(delim).map(x=>x.trim()).filter(Boolean).join(' ')}
    before=before.replace(/[\t,;]+/g,' ').trim();
    let id='';const im=before.match(/^(\d+)\s+(.+)$/);if(im){id=im[1];before=im[2]}
    const times=after.match(/\d{1,2}:\d{2}(?::\d{2})?\s*(?:[AaPp]\.?[Mm]\.?)?/g)||[];
    out.push({'Employee ID':id,'First Name':before,'Date':dm[0].replace(/\s+/g,''),'Time In':times[0]||'','Time Out':times.length>1?times[times.length-1]:''});
  }
  return out;
}
function parseDelimited(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length)return [];
  const delim=lines[0].includes('\t')?'\t':(lines[0].includes(';')&&!lines[0].includes(',')?';':',');
  const split=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;else if(c===delim){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(x=>x.trim())};
  const head=split(lines[0]);
  return lines.slice(1).map(l=>{const cells=split(l);const o={};head.forEach((k,i)=>o[k]=cells[i]??'');return o});
}

/* ---------------- Storage (shared db, or this-device fallback) ---------------- */
function errCode(e){let c=(e&&e.code)||'unavailable';c=String(c).replace('firestore/','').replace(/-/g,'_');if(c==='permission_denied')return 'invalid_argument';if(c==='resource_exhausted'&&e&&/quota/i.test(e.message||''))return 'quota_exceeded';return c}
async function retry(fn){
  let wait=400;
  for(let i=0;;i++){
    try{return await fn()}catch(e){
      const c=errCode(e);
      if((c==='unavailable'||c==='resource_exhausted')&&i<5){await sleep(wait+Math.random()*300);wait*=2;continue}
      throw e;
    }
  }
}
const Remote={
  db:null,
  watchCollection(col,filters,cb,onErr){let q=this.db.collection(col);for(const f of filters)q=q.where(f[0],f[1],f[2]);q=q.limit(1000);
    return q.onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),_id:d.id}))),e=>onErr&&onErr(e))},
  watchDoc(path,cb,onErr){return this.db.doc(path).onSnapshot(s=>cb(s.exists?{...s.data()}:null),e=>onErr&&onErr(e))},
  async get(path){const s=await retry(()=>this.db.doc(path).get());return s.exists?JSON.parse(JSON.stringify(s.data())):null},
  set(path,d){return retry(()=>this.db.doc(path).set(d))},
  update(path,d){return retry(()=>this.db.doc(path).update(d))},
  del(path){return retry(()=>this.db.doc(path).delete())},
  async getAll(col){const q=await retry(()=>this.db.collection(col).get());return q.docs.map(d=>[d.id,JSON.parse(JSON.stringify(d.data()))])}
};
const LKEY='prime-laundry-payroll-v1';
const Local={
  data:{},watchers:new Set(),
  load(){try{this.data=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){this.data={}}},
  save(){try{localStorage.setItem(LKEY,JSON.stringify(this.data))}catch(e){}},
  notify(){for(const w of this.watchers)w()},
  cmp(a,op,b){switch(op){case'==':return a===b;case'>=':return a>=b;case'<=':return a<=b;case'>':return a>b;case'<':return a<b;case'!=':return a!==b;default:return true}},
  watchCollection(col,filters,cb){const run=()=>{const out=[];for(const[p,v]of Object.entries(this.data)){const i=p.lastIndexOf('/');if(p.slice(0,i)!==col)continue;if(filters.every(f=>this.cmp(v[f[0]],f[1],f[2])))out.push({...v,_id:p.slice(i+1)})}cb(out)};
    this.watchers.add(run);setTimeout(run,0);return()=>this.watchers.delete(run)},
  watchDoc(path,cb){const run=()=>cb(this.data[path]?JSON.parse(JSON.stringify(this.data[path])):null);this.watchers.add(run);setTimeout(run,0);return()=>this.watchers.delete(run)},
  async get(path){return this.data[path]?JSON.parse(JSON.stringify(this.data[path])):null},
  async set(path,d){this.data[path]=JSON.parse(JSON.stringify(d));this.save();this.notify()},
  async update(path,d){if(!this.data[path])throw{code:'invalid_argument'};this.data[path]={...this.data[path],...JSON.parse(JSON.stringify(d))};this.save();this.notify()},
  async del(path){delete this.data[path];this.save();this.notify()},
  async getAll(col){const out=[];for(const[p,v]of Object.entries(this.data)){const i=p.lastIndexOf('/');if(p.slice(0,i)===col)out.push([p.slice(i+1),JSON.parse(JSON.stringify(v))])}return out}
};
let Store=Local;

/* ---------------- State ---------------- */
const S={
  mode:'loading', company:null, ready:{employees:false,dtr:false},
  employees:[], dtr:[], settings:{...DEFAULTS}, accounts:[], accountDocs:[], roleAccess:{}, deadlines:{}, auditToday:[], payDocs:{}, adv:{}, audit:[], auditMonth:todayISO().slice(0,7),
  me:{id:null,name:'',avatar:'',isOwner:false}, user:null, downloads:null,
  account:null, viewAs:null, period:null, route:'dashboard', profiles:{}, readOnly:false,

/* ---------------- Calculations (from the workbook rules) ---------------- */
function calcEntry(r,emp){
  const st=S.settings, hol=holidayMap();
  let dayClass=dow(r.work_date)===Number(st.rest_day)?'RD':'REG';
  if(hol[r.work_date])dayClass=hol[r.work_date];
  const ti=toMin(r.time_in); let to=toMin(r.time_out);
  const status=r.status_override||((ti!=null)!==(to!=null)?'CHK':(ti!=null&&to!=null?'P':(dayClass==='RD'?'RD':(dayClass!=='REG'?'HOL':'A'))));
  const sIn=toMin((emp&&emp.shift_in)||st.std_in), ndS=toMin(st.nd_start), ndE=toMin(st.nd_end);
  let sOut=toMin((emp&&emp.shift_out)||st.std_out); if(sOut<=sIn)sOut+=1440;
  let tiA=ti; if(tiA!=null&&sOut>1440&&tiA<sIn-720)tiA+=1440;
  if(tiA!=null&&to!=null&&to<tiA)to+=1440;
  let late=0,ut=0,worked=0,otActual=0,nd=0;
  if(status==='P'&&tiA!=null&&to!=null){
    const ti2=tiA;
    worked=Math.max(0,Math.round(to-ti2)-Number(st.break_min));
    if(dayClass==='REG'){
      late=Math.max(0,Math.round(ti2-sIn)-Number(st.grace_min));
      ut=Math.max(0,Math.round(sOut-to));
      otActual=Math.max(0,Math.round(to-sOut));
    } else otActual=Math.max(0,worked-Number(st.hours_per_day)*60);
    for(const base of[-1440,0,1440]){const a=Math.max(ti2,base+ndS),b=Math.min(to,base+1440+ndE);if(b>a)nd+=Math.round(b-a)}
  }
  const otOk=emp?emp.ot_eligible!==false:true;
  const approvedOt=(otOk&&r.ot_approval==='YES'&&otActual>=Number(st.min_ot))?otActual:0;
  const offset=r.offset_ot_to_absent==='YES'?Math.min(approvedOt,Math.max(0,Number(r.offset_minutes)||0)):0;
  const absent=dayClass==='REG'?(status==='A'?1:(status==='HD'?0.5:0)):0;
  const otPending=otOk&&otActual>=Number(st.min_ot)&&(!r.ot_approval||r.ot_approval==='PENDING');
  return {status,dayClass,late,ut,worked,otActual,otApproved:approvedOt,otPaid:approvedOt-offset,offset,nd,absent,otPending};
}
/* SSS (2025 table, as in the payroll file): MSC from compensation in ₱500 bands (min 5,000, max 35,000).
   Regular SS on MSC up to 20,000 (ER 10%, EE 5%); the excess is the Mandatory Provident Fund (ER 10%, EE 5%).
   EC is ER-only: ₱10 below an MSC of 15,000, ₱30 from 15,000. */
function sssCalc(comp){
  const st=S.settings,z={msc:0,er:0,ee:0,ec:0,mpfEr:0,mpfEe:0};
  if(!(comp>0))return z;
  const msc=Math.min(Number(st.sss_max_msc),Math.max(Number(st.sss_min_msc),Math.floor((comp+250)/500)*500));
  const reg=Math.min(msc,Number(st.sss_reg_cap)),mpf=Math.max(0,msc-Number(st.sss_reg_cap));
  return {msc,er:r2(reg*st.sss_er_rate),ee:r2(reg*st.sss_ee_rate),ec:msc<Number(st.ec_threshold)?Number(st.ec_low):Number(st.ec_high),mpfEr:r2(mpf*st.sss_er_rate),mpfEe:r2(mpf*st.sss_ee_rate)};
}
function monthlyTax(t){
  if(t<=0)return 0;
  // Monthly TRAIN table as used in the payroll file's withholding tax calculator
  const B=[[0,0,0],[20833,0,.15],[33333,1875,.20],[66667,8541.67,.25],[166667,33541.67,.30],[666667,183541.67,.35]];
  let c=B[B.length-1];for(let i=0;i<B.length;i++){if(i===B.length-1||t<B[i+1][0]){c=B[i];break}}
  return r2(c[1]+Math.max(0,t-c[0])*c[2]);
}
/* One cut-off for one employee. */
function cutCalc(e,rows,cutoff){
  const st=S.settings,hol=holidayMap(),today=todayISO(),hpd=Number(st.hours_per_day);
  const otMult=c=>c==='REG'?st.ot_reg:(c==='RH'?st.ot_rh:st.ot_snw);
  const ndBase=c=>c==='REG'?st.nd_base_reg:(c==='RH'?st.nd_base_rh:st.nd_base_snw);
  const mr=numOrNull(e.monthly_rate),dr=numOrNull(e.daily_rate);
  const daily=dr!=null?dr:(mr!=null?mr*12/st.divisor:0), monthly=mr!=null?mr:daily*st.divisor/12, hourly=daily/hpd;
  const isMonthly=e.pay_basis!=='Daily';
  const t={late:0,ut:0,absent:0,offset:0,ot:0,nd:0,present:0,pendingOt:0,chk:0,review:0,otPay:0,ndPay:0,hol:0,holDays:0};
  const byDate={};
  for(const r of rows){
    byDate[r.work_date]=r;
    const c=calcEntry(r,e);
    t.late+=c.late;t.ut+=c.ut;t.absent+=c.absent;t.offset+=c.offset;t.ot+=c.otPaid;t.nd+=c.nd;
    if(c.status==='P')t.present+=1;if(c.status==='HD')t.present+=0.5;
    if(c.otPending)t.pendingOt++;if(c.status==='CHK')t.chk++;if((r.review_status||'FOR REVIEW')!=='APPROVED')t.review++;
    t.otPay+=hourly*(c.otPaid/60)*otMult(c.dayClass);
    t.ndPay+=hourly*(c.nd/60)*st.nd_pct*ndBase(c.dayClass);
    if(c.status==='P'){ // premium for work on holidays / rest days (first 8 hours; beyond that is overtime)
      if(c.dayClass==='RH'){t.hol+=daily*st.hol_rh_prem;t.holDays++}
      else if(c.dayClass==='SNW'){t.hol+=daily*st.hol_snw_prem;t.holDays++}
      else if(c.dayClass==='RD'){t.hol+=daily*(isMonthly?1+Number(st.rd_prem):Number(st.rd_prem));t.holDays++}
    }
  }
  let missing=0;
  for(let d=cutoff.start;d<=cutoff.end&&d<=today;d=addDays(d,1)){
    const isRest=dow(d)===Number(st.rest_day);
    if(!isMonthly&&hol[d]==='RH'&&!isRest){const r=byDate[d];const c=r?calcEntry(r,e):null;if(!c||(c.status!=='P'&&c.status!=='HD')){t.hol+=daily;t.holDays++}}
    if(!isRest&&!hol[d]&&!byDate[d])missing++;
  }
  const absentNet=Math.max(0,t.absent-t.offset/(hpd*60));
  const half=r2(monthly/2), basic=isMonthly?(cutoff.n===1?half:r2(monthly-half)):daily*t.present;
  const lateUt=daily/(hpd*60)*(t.late+t.ut);
  const absence=isMonthly?daily*absentNet:0;
  const netLA=Math.max(0,basic-lateUt-absence);
  const allowance=(Number(e.monthly_allowance)||0)/2;
  const taxAllow=e.allowance_taxable?allowance:0;
  const gross=netLA+allowance+t.hol+t.otPay+t.ndPay;
  const adv=Number(((S.adv[cutoff.n]||{})[e.id]||{}).amount)||0;
  return {t,missing,absentNet,daily:r2(daily),monthly,basic:r2(basic),lateUt:r2(lateUt),absence:r2(absence),netLA:r2(netLA),allowance:r2(allowance),taxAllow:r2(taxAllow),
    hol:r2(t.hol),otPay:r2(t.otPay),ndPay:r2(t.ndPay),gross:r2(gross),govBasis:r2(netLA+t.hol+taxAllow),adv:r2(adv)};
}
/* Payroll frequency: most staff are paid on both cut-offs. Staff paid once a month ('first' or 'second') get the whole month in that one payout: both cut-offs are added together there and the other cut-off shows nothing. */
const CUT_SUM=['basic','lateUt','absence','netLA','allowance','taxAllow','hol','otPay','ndPay','gross','govBasis','adv'];
function mergeCuts(a,b){const o={...a,t:{},missing:a.missing+b.missing,absentNet:a.absentNet+b.absentNet};for(const f of CUT_SUM)o[f]=r2(a[f]+b[f]);for(const k of Object.keys(a.t))o.t[k]=a.t[k]+b.t[k];return o}
function zeroCut(a){const o={...a,t:{},missing:0,absentNet:0,off:true};for(const f of CUT_SUM)o[f]=0;for(const k of Object.keys(a.t))o.t[k]=0;return o}
const payFreq=e=>e&&(e.pay_frequency==='first'||e.pay_frequency==='second')?e.pay_frequency:'both';
const payItems=(items,tab)=>tab==='1'||tab==='2'?items.filter(x=>!x['k'+tab].off):items;
/* Whole payroll month: both cut-offs, government contributions (deducted on the 2nd cut-off) and BIR figures. */
function computePayroll(){
  const st=S.settings,P=S.period;
  const byEmp={};for(const r of S.dtr)(byEmp[r.employee_id]=byEmp[r.employee_id]||[]).push(r);
  return S.employees.filter(e=>e.active!==false).sort((a,b)=>a.id-b.id).map(e=>{
    const rows=byEmp[e.id]||[];
    let [k1,k2]=P.cuts.map(c=>cutCalc(e,rows.filter(r=>r.work_date>=c.start&&r.work_date<=c.end),c));
    const freq=payFreq(e);
    if(freq==='first'){k1=mergeCuts(k1,k2);k2=zeroCut(k2)}else if(freq==='second'){k2=mergeCuts(k2,k1);k1=zeroCut(k1)}
    const hasRate=numOrNull(e.monthly_rate)!=null||numOrNull(e.daily_rate)!=null;
    const bir=hasRate&&e.deducted_government!==false;
    const compBasis=r2(k1.govBasis+k2.govBasis);
    const phicBasis=e.pay_basis!=='Daily'?k1.monthly:r2(k1.basic+k2.basic);
    const sss=bir?sssCalc(compBasis):sssCalc(0);
    const phicEe=bir?r2(Math.min(Math.max(phicBasis,st.phic_floor),st.phic_ceiling)*st.phic_rate*st.phic_employee_share):0;
    const phicEr=bir?r2(Math.min(Math.max(phicBasis,st.phic_floor),st.phic_ceiling)*st.phic_rate)-phicEe:0;
    const hdmfEe=bir?Number(st.hdmf_ee):0, hdmfEr=bir?Number(st.hdmf_er):0;
    const sssEeTot=r2(sss.ee+sss.mpfEe), contribEe=r2(sssEeTot+phicEe+hdmfEe);
    const mwe=e.subject_tax===false;
    const taxable=bir&&!mwe?Math.max(0,r2(compBasis-contribEe)):0;
    const tax=bir&&!mwe?monthlyTax(taxable):0;
    const taxType=!bir?'':(mwe?'T1':(tax>0?'T3':'T2'));
    const gk=freq==='first'?k1:k2,ok=freq==='first'?k2:k1; // government contributions and tax come off the last payout of the month
    Object.assign(gk,{sss:sssEeTot,phic:phicEe,hdmf:hdmfEe,tax});
    ok.sss=ok.phic=ok.hdmf=ok.tax=0;
    gk.ded=r2(gk.adv+contribEe+tax);gk.net=r2(gk.gross-gk.ded);
    ok.ded=ok.adv;ok.net=r2(ok.gross-ok.ded);
    const sum=f=>r2(k1[f]+k2[f]);
    const mo={basic:sum('basic'),lateUt:sum('lateUt'),absence:sum('absence'),netLA:sum('netLA'),allowance:sum('allowance'),hol:sum('hol'),otPay:sum('otPay'),ndPay:sum('ndPay'),gross:sum('gross'),adv:sum('adv'),
      sss:sssEeTot,phic:phicEe,hdmf:hdmfEe,tax,ded:sum('ded'),net:sum('net'),net1:k1.net,net2:k2.net};
    const tt={};for(const k of Object.keys(k1.t))tt[k]=k1.t[k]+k2.t[k];
    return {e,freq,hasRate,bir,mwe,k1,k2,mo,t:tt,missing:k1.missing+k2.missing,absentNet:k1.absentNet+k2.absentNet,daily:k1.daily,
      birRow:{basic:mo.basic,lateAbs:r2(mo.lateUt+mo.absence),netLA:mo.netLA,hol:mo.hol,taxAllow:r2(k1.taxAllow+k2.taxAllow),ntAllow:r2(mo.allowance-k1.taxAllow-k2.taxAllow),otnd:r2(mo.otPay+mo.ndPay),comp:compBasis,phicBasis,
        msc:sss.msc,sssEr:sss.er,sssEe:sss.ee,ec:sss.ec,mpfEr:sss.mpfEr,mpfEe:sss.mpfEe,phicEr,phicEe,hdmfEr,hdmfEe,contribEe,netContrib:r2(compBasis-contribEe),taxable,tax,taxType}};
  });
}

   Changing this account's password from the app saves a new hash that replaces this one. */
const BOOT_ACCOUNT={email:'apacctg@gmail.com',full_name:'HR Administrator',role:'ADMIN',department:null,active:true,
  salt:'JAmQ9kFjIH8ecZQIutxOeA==',iter:210000,hash:'TIIo+hXhOl1VoH9ebJoDq2fHKxs08f97f0MNGIFXwXA=',builtin:true};
const SESSION_KEY='pl-session', LOCK_KEY='pl-login-lock', IDLE_MS=30*60*1000, MAX_TRIES=5, LOCK_MS=5*60*1000;
const enc=new TextEncoder();
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};

let auditQueue=Promise.resolve();
/* ---------------- Undo journal ----------------
   Changes made through a journal remember how each record looked before (and a fingerprint of how it
   looked after). The snapshot is saved under <company>/undo/<id> and linked from the activity-log entry,
   so an Admin can put the records back later. Records changed again since are never overwritten. */
function stableStr(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v))return '['+v.map(stableStr).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';
}
function docPrint(d){const t=d==null?'null':stableStr(d);let x=5381;for(let i=0;i<t.length;i++)x=((x<<5)+x+t.charCodeAt(i))|0;return (x>>>0).toString(36)+'.'+t.length}
const plainDoc=d=>{if(d==null)return null;const c=JSON.parse(JSON.stringify(d));delete c._id;return c};
function journal(){
  const ops=new Map();
  const note=async(path,before)=>{
    if(ops.has(path))return ops.get(path).cur;
    const b=plainDoc(before!==undefined?before:await Store.get(path));
    ops.set(path,{p:path,b,cur:b});return b;
  };
  const after=(path,doc)=>{const o=ops.get(path);o.cur=plainDoc(doc);o.a=docPrint(o.cur)};
  return{ops,
    async set(path,doc,before){await note(path,before);await Store.set(path,doc);after(path,doc)},
    async update(path,patch,before){const b=await note(path,before);await Store.update(path,patch);after(path,{...(b||{}),...JSON.parse(JSON.stringify(patch))})},
    async del(path,before){await note(path,before);await Store.del(path);after(path,null)}
  };
}
async function saveUndo(entry,jr){
  const ops=[...jr.ops.values()].filter(o=>o.a).map(o=>({p:o.p,b:o.b,a:o.a}));
  if(!ops.length)return;
  const id=entry.at.replace(/[^0-9]/g,'')+'_'+Math.random().toString(36).slice(2,8);
  const parts=[[]];let size=0;   // Firestore documents hold up to 1 MB, so big imports are split
  for(const o of ops){const n=JSON.stringify(o).length;if(size+n>700000&&parts[parts.length-1].length){parts.push([]);size=0}parts[parts.length-1].push(o);size+=n}
  for(let i=parts.length-1;i>=1;i--)await Store.set(cp('undo/')+id+'~'+i,{ops:parts[i]});
  await Store.set(cp('undo/')+id,{at:entry.at,by:entry.by,action:entry.action,details:entry.details,parts:parts.length,count:ops.length,ops:parts[0]});
  entry.undo=id;
}
function logAction(action,entity,entityId,details,jr){
  const entry={at:nowISO(),by:actor(),action,entity,entity_id:entityId==null?null:String(entityId),details:details||''};
  const path=cp('audit/'+entry.at.slice(0,7));
  auditQueue=auditQueue.then(async()=>{
    if(jr)try{await saveUndo(entry,jr)}catch(e){console.warn('undo snapshot',e)}
    try{const d=(await Store.get(path))||{entries:[]};const entries=(d.entries||[]).concat(entry).slice(-1500);await Store.set(path,{entries})}catch(e){console.warn('audit',e)}
  });
  return auditQueue;
}

function accountTrail(id){
  // Follows former emails to the current account; reports deleted accounts. Records are never erased.
  const docs=S.accountDocs||[],seen=new Set();let cur=id,d=docs.find(x=>x.email===cur),name=d&&d.full_name,note='';
  while(d&&d.moved_to&&!seen.has(cur)){seen.add(cur);cur=d.moved_to;d=docs.find(x=>x.email===cur)}
  if(cur!==id)note=`email changed → ${cur}`;
  if(d&&d.deleted)note=(note?note+' · ':'')+'account deleted';
  const live=S.accounts.find(x=>x.email===cur)||(cur===BOOT_ACCOUNT.email?BOOT_ACCOUNT:null);
  return{name:(live&&live.full_name)||(d&&d.full_name)||name||'',note,deleted:!!(d&&d.deleted),current:cur};
}

  let issues='';

    const noRate=items.filter(x=>!x.hasRate).length,pend=items.reduce((a,x)=>a+x[k].t.pendingOt,0),rev=items.reduce((a,x)=>a+x[k].t.review,0),negs=items.filter(x=>x[k].net<0).length;

  }

  let rows=visibleDtr();
  const f=S.ui;
  if(f.dtrCut){const c=S.period.cuts[f.dtrCut-1];rows=rows.filter(x=>x.work_date>=c.start&&x.work_date<=c.end)}
  if(!isHead&&f.dtrDept)rows=rows.filter(x=>{const e=empById(x.employee_id);return e&&e.department===f.dtrDept});
  if(f.dtrSearch){const q=f.dtrSearch.toUpperCase();rows=rows.filter(x=>empName(empById(x.employee_id)).toUpperCase().includes(q))}
  const withCalc=rows.map(x=>({r:x,e:empById(x.employee_id),c:calcEntry(x,empById(x.employee_id))}));
  const filt={all:()=>true,review:o=>(o.r.review_status||'FOR REVIEW')==='FOR REVIEW',issue:o=>o.r.review_status==='WITH ISSUE',approved:o=>o.r.review_status==='APPROVED',
    ot:o=>o.c.otActual>=S.settings.min_ot,exceptions:o=>o.c.status==='A'||o.c.status==='CHK'||o.c.late>0||o.c.ut>0||o.c.otPending};

  const lk=S.period.cuts.filter(c=>cutLocked(c.n));
  if(lk.length)html+=`<div class="banner ok">${lk.map(c=>`${c.n===1?'1st':'2nd'} cut-off attendance (${fmtRange(c.start,c.end)})`).join(' and ')} ${lk.length>1?'are':'is'} locked because payroll was approved. Payroll can reopen it if a correction is needed.</div>`;
  html+=`<div class="row" style="margin-bottom:14px">
    <select data-change="dtrCut" aria-label="Cut-off"><option value="0">Whole month</option>${S.period.cuts.map(c=>`<option value="${c.n}" ${f.dtrCut===c.n?'selected':''}>${c.n===1?'1st':'2nd'} cut-off · ${h(fmtD(c.start))}–${h(fmtD(c.end))}</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="Filter">${segs.map(([k,l])=>`<button data-act="dtrFilter" data-v="${k}" aria-pressed="${f.dtrFilter===k}">${l}</button>`).join('')}</div>
    ${!isHead?`<select data-change="dtrDept" aria-label="Department"><option value="">All departments</option>${DEPARTMENTS.map(d=>`<option ${f.dtrDept===d?'selected':''}>${h(d)}</option>`).join('')}</select>`:''}
    <input type="search" placeholder="Search name" value="${h(f.dtrSearch)}" data-change="dtrSearch" aria-label="Search name" style="width:160px">
    <span class="spacer"></span>

  if(f.dtrSelMode&&canDelDtr()){

function dtrChips(o){
  const c=o.c,st=S.settings,ch=[];
  const sCls={P:'ok',A:'bad',CHK:'bad',RD:'',HOL:'acc',HD:'warn'}[c.status]||'';
  ch.push(`<span class="chip ${sCls}">${STATUS_LABEL[c.status]||c.status}</span>`);
  if(c.dayClass!=='REG'&&c.status!=='RD'&&c.status!=='HOL')ch.push(`<span class="chip acc">${{RD:'Rest day',RH:'Regular holiday',SNW:'Special holiday'}[c.dayClass]}</span>`);
  if(c.late)ch.push(`<span class="chip warn">Late ${fmtMin(c.late)}</span>`);
  if(c.ut)ch.push(`<span class="chip warn">Undertime ${fmtMin(c.ut)}</span>`);
  if(c.otActual>=st.min_ot){const a=o.r.ot_approval||'PENDING';ch.push(`<span class="chip ${a==='YES'?'ok':(a==='NO'?'':'warn')}">OT ${fmtMin(c.otActual)} · ${a==='YES'?'approved':(a==='NO'?'not approved':'pending')}</span>`)}
  else if(c.otActual>0)ch.push(`<span class="chip">OT ${fmtMin(c.otActual)} (under ${st.min_ot}m)</span>`);
  if(c.nd)ch.push(`<span class="chip acc">Night ${fmtMin(c.nd)}</span>`);
  if(o.r.remarks)ch.push(`<span class="chip" title="${h(o.r.remarks)}">Note</span>`);
  return ch.join('');
}

async function deleteDtrRecords(ids){
  const recs=ids.map(id=>S.dtr.find(x=>x._id===id)).filter(Boolean);
  const ok=recs.filter(r=>!lockedDate(r.work_date)), locked=recs.length-ok.length;
  if(!ok.length){toast(locked?'Those records are in an approved, locked cut-off.':'Nothing to delete.',true);return false}
  const one=ok.length===1?ok[0]:null;
  const title=one?`Delete ${empName(empById(one.employee_id))} · ${fmtDY(one.work_date)}?`:`Delete ${ok.length} attendance records?`;
  const msg=`${one?'This record is':'These records are'} removed from attendance and from payroll for ${one?'that day':'those days'}, together with ${one?'its':'their'} review and approvals. This can’t be undone — import the DTR again or use Single entry to bring ${one?'it':'them'} back.${locked?` ${locked} locked ${locked===1?'record':'records'} will be left as is.`:''}`;
  if(!(await confirmDlg(title,msg,'Delete',true)))return false;
  let n=0;const names=[],jr=journal();
  try{
    for(const r of ok){
      await jr.del(cp('dtr/')+r._id,r);n++;
      if(names.length<12)names.push(`${empName(empById(r.employee_id))} ${r.work_date} ${r.time_in||'—'}–${r.time_out||'—'}`);
    }
  }catch(e){writeError(e)}
  if(n){
    logAction('DELETE_ATTENDANCE','dtr',one?one._id:null,one?names[0]:`${n} records deleted: ${names.join('; ')}${n>names.length?` and ${n-names.length} more`:''}`,jr);
    toast(n===1?'Attendance record deleted':`${n} attendance records deleted`);
  }
  return n>0;
}

async function saveDtr(form){
  const id=form.dataset.id, r=S.dtr.find(x=>x._id===id); if(!r)return;
  const e=empById(r.employee_id);
  if(role()==='DEPT_HEAD'&&(!e||e.department!==dept())){toast('You can only review your own department.',true);return}
  if(lockedDate(r.work_date)){toast('This cut-off is approved and locked.',true);return}
  const fd=new FormData(form), patch={};
  const g=k=>fd.get(k);
  if(can('approveDtr')){
    Object.assign(patch,{ot_approval:g('ot_approval')||'PENDING',absent_approval:g('absent_approval')||'PENDING',offset_ot_to_absent:g('offset_ot_to_absent')||'NO',
      offset_minutes:Math.max(0,parseInt(g('offset_minutes')||'0',10)||0),remarks:(g('remarks')||'').trim(),review_status:g('review_status')||'FOR REVIEW',reviewed_by:actor(),reviewed_at:nowISO()});
  }
  const changes=[];
  if(can('editTimes')){
    const ti=g('time_in')||null,to=g('time_out')||null,so=g('status_override')||null;
    if(ti!==(r.time_in||null)){changes.push(`time in ${r.time_in||'—'} → ${ti||'—'}`);patch.time_in=ti}
    if(to!==(r.time_out||null)){changes.push(`time out ${r.time_out||'—'} → ${to||'—'}`);patch.time_out=to}
    if(so!==(r.status_override||null)){changes.push(`status → ${so||'automatic'}`);patch.status_override=so}
    if(changes.length&&!patch.remarks&&!(r.remarks)){toast('Add a remark explaining the time correction.',true);return}
  }
  try{
    const jr=journal();
    await jr.update(cp('dtr/')+id,patch,r);
    S.ui.openRow=null;
    logAction(changes.length?'CORRECT':'REVIEW','dtr',id,`${empName(e)} ${r.work_date}: ${patch.review_status||''}${patch.ot_approval?`, OT ${patch.ot_approval}`:''}${changes.length?'; '+changes.join(', '):''}`,jr);
    toast('Review saved');scheduleRender();
  }catch(err){writeError(err)}
}
async function bulkApprove(btn){
  btn.disabled=true;
  const rows=[...document.querySelectorAll('.dtr-row')].map(b=>b.dataset.id);
  const targets=S.dtr.filter(r=>rows.includes(r._id)&&(r.review_status||'FOR REVIEW')==='FOR REVIEW'&&!lockedDate(r.work_date));
  let n=0;const jr=journal();
  try{
    for(const r of targets){
      const e=empById(r.employee_id);if(role()==='DEPT_HEAD'&&(!e||e.department!==dept()))continue;
      await jr.update(cp('dtr/')+r._id,{review_status:'APPROVED',reviewed_by:actor(),reviewed_at:nowISO()},r);n++;
      if(n%5===0)btn.textContent=`Saving ${n}/${targets.length}…`;
    }
    logAction('BULK_APPROVE','dtr',null,`${n} records marked approved (overtime approvals unchanged)`,jr);
    toast(`${n} records marked approved. Overtime still needs its own approval.`);
  }catch(err){writeError(err)}
  scheduleRender();
}

/* Matching only looks at employees registered under the company you are working in (S.employees
   holds that company's employees only). Within one company no two employees share a first name,
   so the first name decides; a DTR row is never matched to someone in another company.
   Employee ID is optional and is only used as a tie-breaker. */
const normName=v=>String(v||'').toUpperCase().replace(/\./g,' ').replace(/[^A-Z0-9Ñ ]/g,' ').replace(/\b(JR|SR|II|III|IV)\b/g,' ').replace(/\s+/g,' ').trim();
const canPick=x=>x.match==='OK'||x.match==='CONFIRM';
function findEmployee(id,name){
  const co=curCo().short;
  const idStr=id!=null?String(id).trim():'', byId=/^\d+$/.test(idStr)?empById(Number(idStr)):null;
  const raw0=String(name||'').trim(),paren=(raw0.match(/[\(\[][^)\]]*[\)\]]/g)||[]).join(' ').trim();
  // Notes such as "(Reliever)" in the DTR name are not part of the name.
  const raw=raw0.replace(/[\(\[][^)\]]*[\)\]]/g,' ').replace(/\s+/g,' ').trim()||raw0;
  if(!raw){return byId?[byId,'OK','No name in the row — matched by Employee ID']:[null,'No first name']}
  let n=normName(raw), sur=null;
  if(raw.includes(',')){const parts=raw.split(',');sur=normName(parts[0]);n=normName(parts.slice(1).join(' '))}
  const all=S.employees, act=all.filter(e=>e.active!==false);
  const pick=(test,how,status)=>{
    let list=act.filter(test),notes=[how];
    if(!list.length){list=all.filter(test);if(list.length)notes.push('employee is marked inactive')}
    if(sur){const s2=list.filter(e=>normName(e.surname)===sur);if(s2.length===1)list=s2}
    if(list.length===1)return[list[0],status||'OK',notes.filter(Boolean).join(' · ')];
    if(list.length>1){
      if(byId&&list.includes(byId))return[byId,status||'OK','Same first name as another employee — told apart by Employee ID'];
      return[null,`More than one ${co} employee matches (${list.map(e=>empName(e)).join(' / ')}) — add the surname or Employee ID`];
    }
    return null;
  };
  const sameTok=(a,b)=>{const x=normName(a).split(' ').filter(Boolean).sort().join(' '),y=normName(b).split(' ').filter(Boolean).sort().join(' ');return x&&x===y};
  let r=pick(e=>e.portal_name&&sameTok(e.portal_name,raw),'matched by the name in the portal');
  if(!r)r=pick(e=>normName(e.first_name)===n,'');
  if(!r)r=pick(e=>normName(e.first_name+' '+e.surname)===n||normName(e.surname+' '+e.first_name)===n,'');
  if(!r){ // every word of "first name + surname" is in the DTR name, plus extra words (e.g. "Mary Jane Orquia Reliever")
    const nt=new Set((n+' '+(sur||'')).split(' ').filter(Boolean));
    r=pick(e=>{const ft=normName(e.first_name+' '+e.surname).split(' ').filter(Boolean);return ft.length>1&&ft.every(w=>nt.has(w))},'extra words in the DTR name were ignored');
  }
  if(!r){ // same first name, surname spelled one letter differently (Gonzales / Gonzalez): offered for confirmation, never ticked automatically
    const nt2=[...new Set((n+' '+(sur||'')).split(' ').filter(Boolean))];
    const near=(x,y)=>{if(x===y)return true;if(x.length<5||y.length<5||Math.abs(x.length-y.length)>1)return false;let i=0;while(i<x.length&&i<y.length&&x[i]===y[i])i++;return x.slice(i+1)===y.slice(i+1)||x.slice(i)===y.slice(i+1)||x.slice(i+1)===y.slice(i)};
    r=pick(e=>{const ft=normName(e.first_name).split(' ').filter(Boolean),st=normName(e.surname).split(' ').filter(Boolean);return ft.length&&st.length&&ft.every(w=>nt2.includes(w))&&st.every(w=>nt2.some(t=>near(t,w)))},'surname is spelled slightly differently in the DTR','CONFIRM');
    if(r&&r[0])r[2]=[`DTR name “${raw}” has a surname spelled differently from ${empName(r[0])} — check that it is the same person`,r[2]].filter(Boolean).join(' · ');
  }
  if(!r){
    // Partial match (e.g. DTR "MARY" vs employee "MARY JANE"). Never ticked automatically.
    const tok=n.split(' ')[0];
    r=pick(e=>normName(e.first_name).split(' ')[0]===tok,'','CONFIRM');
    if(r&&r[0])r[2]=[`DTR name “${raw}” only partly matches first name ${r[0].first_name}`,r[2]].filter(Boolean).join(' · ');
  }
  if(!r)return[null,`First name not found among ${co} employees`];
  if(r[0]&&paren)r[2]=[r[2],`“${paren}” in the DTR name was ignored`].filter(Boolean).join(' · ');
  if(r[0]&&byId&&byId!==r[0])r[2]=[r[2],`Employee ID ${idStr} belongs to ${empName(byId)} and was ignored`].filter(Boolean).join(' · ');
  return r;
}
/* Optional Company column: which company a DTR row belongs to. */
function companyFromText(v){
  const n=normName(v);if(!n)return undefined;
  const aliases=c=>[c.name,c.short,c.defaults.company,c.file.replace(/-/g,' ')].map(normName);
  // A bare short code (e.g. "TSL", "CBL") counts only when no other company's name contains it — "PRIME" alone is ambiguous.
  const code=c=>{const k=normName(c.id);return COMPANIES.some(o=>o!==c&&aliases(o).some(a=>a.split(' ').includes(k)))?[]:[k]};
  let hit=COMPANIES.filter(c=>[...code(c),...aliases(c)].includes(n));
  if(!hit.length)hit=COMPANIES.filter(c=>aliases(c).some(a=>a.length>=5&&(a.includes(n)&&n.length>=5||n.includes(a))));
  return hit.length===1?hit[0].id:null;
}
/* First names used in the other companies you can open — only to point out, in the preview,
   that a name also exists elsewhere. Matching itself never looks outside the current company. */
async function loadOtherCompanies(){
  S.ui.otherCo={};const coAtStart=S.company,out={};
  for(const id of myCompanies()){
    if(id===coAtStart)continue;const c=coById(id);
    try{const docs=await Store.getAll(c.prefix+'employees');out[id]=new Set(docs.filter(([,e])=>e&&e.active!==false).map(([,e])=>normName(e.first_name)))}catch(e){}
  }
  if(S.company!==coAtStart)return;
  S.ui.otherCo=out;if(S.route==='import')scheduleRender();
}
function otherCoWith(eid){
  const e=empById(eid),m=S.ui.otherCo;if(!e||!m)return[];
  const n=normName(e.first_name);return Object.keys(m).filter(id=>m[id].has(n)).map(id=>coById(id).short);

function impNameCell(x,i){

}
function impAssign(i,val){
  const rows=S.ui.importRows||[],x=rows[i];if(!x)return;
  const key=normName(x.src),group=rows.filter(r=>normName(r.src)===key);
  let n=0;
  for(const r of group){
    if(!val){ // back to the automatic match
      if(r.orig){Object.assign(r,r.orig);delete r.orig}
      r.manual=false;r.editing=false;n++;continue;
    }
    const e=empById(val);if(!e)continue;
    if(!r.orig)r.orig={employee_id:r.employee_id,name:r.name,department:r.department,match:r.match,note:r.note,sel:r.sel};
    Object.assign(r,{employee_id:e.id,name:empName(e),department:e.department,match:'OK',note:`Assigned by you: “${r.src}” → ${empName(e)}`,manual:true,editing:false,sel:true});n++;
  }
  if(val){ // two different DTR names must not land on the same employee and day
    for(const r of group){
      const other=rows.find(o=>o!==r&&!group.includes(o)&&canPick(o)&&String(o.employee_id)===String(r.employee_id)&&o.date===r.date);
      if(other){r.match=`“${r.src}” and “${other.src}” are both assigned to ${r.name} on this date — they look like different people; change one of them`;r.employee_id=null}
    }
  }
  toast(val?`Assigned ${n} ${n===1?'row':'rows'} named “${x.src}” to ${x.name}.`:`Restored the automatic match for ${n} ${n===1?'row':'rows'}.`);

}
function rowsFromObjects(objs){
  if(!objs.length)throw new Error('The file has no data rows.');
  const keys=Object.keys(objs[0]);const lk={};keys.forEach(k=>lk[String(k).trim().toLowerCase()]=k);
  const pick=(...ns)=>{for(const n of ns)if(n in lk)return lk[n];return null};
  const cId=pick('employee id','ee no.','ee no','employee no','employee number','emp id','emp no','id');
  const cName=pick('employee first name','first name','firstname','name','employee','employee name');
  const cDate=pick('date','work date','day');
  const cIn=pick('time in','in','timein','am in','clock in');
  const cOut=pick('time out','out','timeout','pm out','clock out');
  const cCo=pick('company','company name','employer');
  if(!cName||!cDate||!cIn||!cOut){const miss=[!cName&&'First Name',!cDate&&'Date',!cIn&&'Time In',!cOut&&'Time Out'].filter(Boolean);throw new Error('Missing column'+(miss.length>1?'s':'')+': '+miss.join(', ')+'. The header row needs First Name, Date, Time In and Time Out (Employee ID is optional).')}
  const out=[];
  for(const o of objs){
    const date=parseDate(o[cDate]);
    if(!date&&!o[cName]&&!(cId&&o[cId]))continue;
    const src=String((cName&&o[cName])||(cId&&o[cId])||'').trim();
    let coNote=null;
    if(cCo&&String(o[cCo]||'').trim()){
      const coId=companyFromText(o[cCo]);
      if(coId===null)coNote=`Company “${String(o[cCo]).trim()}” not recognised — use ${COMPANIES.map(c=>c.short).join(', ')}`;
      else if(coId!==S.company)coNote=`For ${coById(coId).short} — switch to that company at the top to import this row`;
    }
    const [e,match,note]=coNote?[null,coNote]:findEmployee(cId?o[cId]:null,o[cName]);
    out.push({employee_id:e?e.id:null,name:e?empName(e):src,src,department:e?e.department:'',date,time_in:parseTime(o[cIn]),time_out:parseTime(o[cOut]),match:!date?'Date not readable — use yyyy-mm-dd, e.g. 2026-10-01':match,note:note||''});
  }
  if(!out.length)throw new Error('No usable rows found.');
  // Several time-clock punches for the same DTR name and date collapse into one day:
  // the earliest Time In and the latest Time Out are kept. Punches are only merged when the
  // name written in the DTR is the same, so two different people are never folded into one.
  const grouped=new Map(),rest=[];
  for(const x of out){
    if(!canPick(x)){rest.push(x);continue}
    const k=x.employee_id+'_'+x.date+'_'+normName(x.src),cur=grouped.get(k);
    if(!cur){grouped.set(k,{...x,punches:1});continue}
    const ins=[cur.time_in,x.time_in].filter(Boolean),outs=[cur.time_out,x.time_out].filter(Boolean);
    cur.time_in=ins.length?ins.sort()[0]:null;cur.time_out=outs.length?outs.sort().pop():null;cur.punches++;
  }
  // Two different DTR names that landed on the same employee and date: neither is imported.
  const byDay=new Map();for(const g of grouped.values()){const k=g.employee_id+'_'+g.date;(byDay.get(k)||byDay.set(k,[]).get(k)).push(g)}
  for(const list of byDay.values())if(list.length>1){
    const names=list.map(g=>`“${g.src||'(no name)'}”`).join(' and ');
    for(const g of list){g.match=`${names} both matched ${empName(empById(g.employee_id))} on this date — they look like different people; fix the names in the DTR and check again`;g.employee_id=null}
  }
  const res=[...grouped.values(),...rest];
  for(const x of res)x.sel=x.match==='OK';
  return res;
}

function portalCuts(){ // current cut-off, the one before it, and the one before that
  const c0=cutoffFor(todayISO()),c1=cutoffFor(addDays(c0.start,-1)),c2=cutoffFor(addDays(c1.start,-1));
  return [c0,c1,c2].map(c=>({...c,label:`${c.n===1?'1st':'2nd'} cut-off ${fmtMonth(c.key.slice(0,7))} (${c.start} to ${c.end})`}));
}

function portalCutOptions(){const cuts=portalCuts(),sel=S.ui.portalCut||cuts[0].key;return cuts.map(c=>`<option value="${h(c.key)}" ${sel===c.key?'selected':''}>${h(c.label)}</option>`).join('')}
/* Pure: combine per-branch synced documents into one report limited to a cut-off. Returns {payload, notes, errors}. */
function portalBuild(docs,cut){
  const notes=[],errors=[],records=[],seen=new Set();let blank=0;
  for(const {name,doc} of docs){
    if(!doc){notes.push(`${name}: nothing synced yet`);continue}
    if(!doc||!Array.isArray(doc.records)||!Array.isArray(doc.blank)||!Array.isArray(doc.dropped)||typeof doc.tableRows!=='number'){errors.push(`${name}: saved data is not in the expected format.`);continue}
    if(doc.records.length+doc.blank.length+doc.dropped.length!==doc.tableRows){errors.push(`${name}: row count mismatch in the saved data (${doc.tableRows} table rows).`);continue}
    if(doc.dropped.length){errors.push(`${name}: ${doc.dropped.length} table ${doc.dropped.length===1?'row has':'rows have'} content that was not recognised as attendance (table row ${doc.dropped.map(x=>x.row).join(', ')}).`);continue}
    if(doc.range&&doc.range.start>cut.start)notes.push(`${name}: synced data starts ${doc.range.start}, so part of this cut-off is missing.`);
    for(const r of doc.records){const d=String(r.time_in||r.time_out||'').slice(0,10);if(d>=cut.start&&d<=cut.end){const k=[r.code,r.staff,r.time_in,r.time_out].join('|');if(seen.has(k))continue;seen.add(k);records.push({...r,_branch:name})}}
    blank+=doc.blank.length;
  }
  return {payload:{v:1,tableRows:records.length+blank,records,blank:Array.from({length:blank},(_,i)=>i+1),dropped:[]},notes,errors};
}

function parsePortal(txt){
  const u=S.ui;u.portalText=txt!=null?txt:$('#portalArea').value;u.portalError='';u.portalInfo='';u.portalSkipped=[];u.importRows=null;
  const fail=m=>{u.portalError=m;scheduleRender()};
  let d;
  try{d=JSON.parse(u.portalText)}catch(e){return fail('That is not the extractor result. Run the extractor again and paste everything it copied.')}
  if(!d||d.v!==1||!Array.isArray(d.records)||!Array.isArray(d.blank)||!Array.isArray(d.dropped)||typeof d.tableRows!=='number')return fail('The pasted text is not in the expected format. Copy the extractor script again from this tab and re-run it.');
  const accounted=d.records.length+d.blank.length+d.dropped.length;
  if(accounted!==d.tableRows)return fail(`Row count mismatch: the table has ${d.tableRows} rows but only ${accounted} were accounted for. Nothing was loaded — run the extractor again.`);
  if(d.dropped.length)return fail(`Import stopped: ${d.dropped.length} table ${d.dropped.length===1?'row has':'rows have'} content but ${d.dropped.length===1?'was':'were'} not recognised as attendance (table row ${d.dropped.map(x=>x.row).join(', ')}). Nothing was loaded. Send me what those rows contain so the extractor can be fixed.`);
  const objs=[],skipped=[];
  const tm=(v,dt)=>parseTime(String(v||'').replace(DATE_RE,' ').replace(dt||'',' '));
  let overnight=0,noOut=0,noIn=0;
  for(const r of d.records){
    const hasIn=!!String(r.time_in||'').trim(),hasOut=!!String(r.time_out||'').trim();
    const di=parseDate(hasIn?r.time_in:r.time_out),label=`${r.staff||'?'} · ${hasIn?r.time_in:'(no time-in) '+r.time_out}`;
    if(!di){skipped.push(`${label} — date not readable`);continue}
    const ti=hasIn?tm(r.time_in):null;
    if(hasIn&&!ti){skipped.push(`${label} — time-in not readable`);continue}
    let to=null;
    if(hasOut){
      const dout=parseDate(r.time_out);
      if(hasIn&&dout&&dout!==di){
        if(dout!==addDays(di,1)){skipped.push(`${label} → ${r.time_out} — time-out is more than a day later; check it on the portal`);continue}
        overnight++;
      }
      to=tm(r.time_out);
      if(!to){skipped.push(`${label} — time-out not readable`);continue}
    }
    if(!hasIn)noIn++;if(!hasOut)noOut++;
    objs.push({'First Name':r.staff,'Date':di,'Time In':ti||'','Time Out':to||''});
  }
  u.portalSkipped=skipped;
  u.portalInfo=`${d.tableRows} table rows: ${d.records.length} attendance records, ${d.blank.length} blank. ${objs.length} ready to check (${noOut} with no time-out yet, ${noIn} with no time-in, ${overnight} overnight), ${skipped.length} not brought in.`;
  if(!objs.length){u.portalError='No attendance rows to import from this report.';scheduleRender();return}
  try{u.importRows=rowsFromObjects(objs);u.importResult=null;scheduleRender()}catch(e){fail(h(e.message||'Could not read the rows.'))}
}
/* ---- Reading any attendance file: find the header row, keep only the columns the app needs ---- */
let TABLE_NOTE='';
function splitTable(text){
  const lines=String(text).replace(/\r/g,'').replace(/^﻿/,'').split('\n');
  const sample=lines.filter(l=>l.trim()).slice(0,40);
  let delim=',',best=-1;for(const d of[',','\t',';'])for(const l of sample){const c=l.split(d).length-1;if(c>best){best=c;delim=d}}
  const split=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;else if(c===delim){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(x=>x.trim())};
  return lines.map(split);
}
function tableToObjects(grid){
  TABLE_NOTE='';
  const nm=s=>String(s==null?'':s).toLowerCase().replace(/[ _\-.]+/g,' ').replace(/\s+/g,' ').trim();
  const rows=(grid||[]).map(r=>(r||[]).map(c=>typeof c==='string'?c.trim():(c==null?'':c)));
  const blank=r=>!r.some(c=>String(c).trim()!=='');
  const NAMES=['first name','firstname','employee first name','name','employee','employee name'],DATES=['date','work date','day'];
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){const h=rows[i].map(nm);if(h.some(x=>NAMES.includes(x))&&h.some(x=>DATES.includes(x))){hi=i;break}}
  if(hi<0){hi=rows.findIndex(r=>!blank(r));if(hi<0)throw new Error('The file has no data rows.')}
  const head=rows[hi],H=head.map(nm);
  const find=(...ns)=>{for(const n of ns){const i=H.indexOf(n);if(i>=0)return i}return -1};
  const iFirst=find(...NAMES),iLast=find('last name','lastname','surname'),iDate=find(...DATES);
  const basicIn=find('time in','timein','am in','in'),basicOut=find('time out','timeout','pm out','out');
  let iIn=basicIn>=0?basicIn:find('clock in time','check in time','first in','in time','punch in','clock in');
  let iOut=basicOut>=0?basicOut:find('clock out time','check out time','last out','out time','punch out','clock out');
  const iRec=find('records','record','punch records','punches'),iCo=find('company','company name','employer');
  const iId=find('employee id','ee no','employee no','employee number','emp id','emp no','id');
  const useRec=(iIn<0||iOut<0)&&iRec>=0;
  if(iFirst<0||iDate<0||(!useRec&&(iIn<0||iOut<0))){
    const seen=head.filter(x=>String(x).trim()).slice(0,14).join(', ');
    const miss=[iFirst<0&&'First Name',iDate<0&&'Date',(!useRec&&iIn<0)&&'Time In',(!useRec&&iOut<0)&&'Time Out'].filter(Boolean);
    throw new Error('Could not find '+miss.join(', ')+' in this file. Columns seen: '+(seen||'none')+'.');
  }
  const smart=hi>0||useRec||iIn!==basicIn||iOut!==basicOut;
  const timesIn=txt=>{const m=String(txt).match(/\d{1,2}:\d{2}(?::\d{2})?\s*(?:[AaPp]\.?[Mm]\.?)?/g)||[];return m.map(parseTime).filter(Boolean)};
  const out=[];let skipped=0;
  for(let r=hi+1;r<rows.length;r++){
    const c=rows[r];if(blank(c))continue;
    const first=String(c[iFirst]??'').trim(),last=iLast>=0?String(c[iLast]??'').trim():'';
    const date=c[iDate];if(String(date).trim()===''&&!first)continue;
    let tin=iIn>=0?c[iIn]:'',tout=iOut>=0?c[iOut]:'';
    if(useRec){const ts=timesIn(c[iRec]);if(iIn<0)tin=ts.length?ts[0]:'';if(iOut<0)tout=ts.length>1?ts[ts.length-1]:''}
    if(smart&&!parseTime(tin)&&!parseTime(tout)){skipped++;continue}
    const o={'First Name':last&&first&&iLast>=0&&H[iFirst]!=='name'?`${last}, ${first}`:first,'Date':date,'Time In':tin,'Time Out':tout};
    if(iCo>=0)o['Company']=c[iCo];
    if(iId>=0)o['Employee ID']=c[iId];
    out.push(o);
  }
  if(skipped)TABLE_NOTE=`${skipped} ${skipped===1?'row':'rows'} with no clock-in or clock-out ${skipped===1?'was':'were'} left out.`;
  return out;
}
async function handleFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  try{
    let objs;
    if(/\.(xlsx|xls)$/i.test(f.name)){
      if(typeof XLSX==='undefined')throw new Error('Excel reading is unavailable here. Save the sheet as CSV and upload that instead.');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
      objs=tableToObjects(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));
    } else objs=tableToObjects(splitTable(await f.text()));
    S.ui.importRows=rowsFromObjects(objs);S.ui.importResult=null;scheduleRender();
    if(TABLE_NOTE)toast(TABLE_NOTE);
  }catch(e){toast(e.message||'Could not read that file.',true)}
}
async function doImport(mode){
  const all=S.ui.importRows||[];
  const rows=mode==='all'?all.filter(x=>x.match==='OK'):all.filter(x=>x.sel&&canPick(x));
  if(!rows.length){toast(mode==='all'?'No matched rows to import.':'Tick at least one row to import.',true);return}
  S.ui.importBusy=true;S.ui.importProgress=0;scheduleRender();
  const lockCache={};
  const isLocked=async d=>{const k=cutoffFor(d).key;if(!(k in lockCache)){const doc=await Store.get(cp('payroll/')+k).catch(()=>null);lockCache[k]=!!(doc&&doc.status==='APPROVED')}return lockCache[k]};
  const loaded=new Map(S.dtr.map(r=>[r._id,r]));
  let saved=0,failed=0,locked=0,i=0,lastErr=null;const done=new Set(),jr=journal();
  const src=S.ui.importTab==='portal'?'portal':S.ui.importTab==='paste'?'paste':'upload', co=curCo().short;
  for(const x of rows){
    i++;
    try{
      if(await isLocked(x.date)){locked++;done.add(x);continue}
      const id=`${x.employee_id}_${x.date}`;
      const inPeriod=x.date>=S.period.start&&x.date<=S.period.end;
      const existing=inPeriod?loaded.get(id):await Store.get(cp('dtr/')+id);
      if(existing)await jr.update(cp('dtr/')+id,{time_in:x.time_in,time_out:x.time_out,source:src,imported_at:nowISO()},existing);
      else await jr.set(cp('dtr/')+id,{employee_id:x.employee_id,work_date:x.date,time_in:x.time_in,time_out:x.time_out,status_override:null,source:src,imported_at:nowISO(),
        ot_approval:'PENDING',absent_approval:'PENDING',offset_ot_to_absent:'NO',offset_minutes:0,remarks:'',review_status:'FOR REVIEW',reviewed_by:null,reviewed_at:null},null);
      saved++;done.add(x);
    }catch(e){failed++;lastErr=e;if(errCode(e)==='invalid_argument'||errCode(e)==='quota_exceeded')break}
    if(i%4===0||i===rows.length){S.ui.importProgress=i/rows.length;const bar=document.querySelector('.progress i');if(bar)bar.style.width=Math.round(S.ui.importProgress*100)+'%'}
  }
  // Rows not imported this time (unticked, to confirm, unmatched or failed) stay in the list.
  const remaining=all.filter(x=>!done.has(x));
  S.ui.importBusy=false;S.ui.importRows=remaining.length?remaining:null;S.ui.importResult={saved,failed,locked,left:remaining.length,co};
  logAction('IMPORT','dtr',null,`${saved} rows imported into ${co} (${src}, ${mode==='all'?'all matched':'selected rows'}); ${locked} locked; ${remaining.length} not imported; ${failed} failed`,jr);
  if(lastErr)writeError(lastErr);
  scheduleRender();
}

function sectionData(tab,items){

    tot=['','TOTAL','','',...cols.map(c=>r2(items.reduce((a,x)=>a+(rowOf(x)[c[0]]||0),0)))];

  return{name:SECTION_NAME[tab],hdr,head,rows,tot,extra};
}
function sheetFor(d){
  const aoa=[...d.hdr.map(t=>[t]),[],d.head,...d.rows,d.tot,...d.extra];
  const ws=XLSX.utils.aoa_to_sheet(aoa),ncol=d.head.length,top=d.hdr.length+1;
  ws['!merges']=d.hdr.map((_,i)=>({s:{r:i,c:0},e:{r:i,c:Math.max(0,ncol-1)}}));
  ws['!cols']=d.head.map((hd,i)=>({wch:i===1?30:(i===0?7:Math.max(12,String(hd).length+2))}));
  const rng=XLSX.utils.decode_range(ws['!ref']);
  for(let R=top+1;R<=rng.e.r;R++)for(let C=0;C<=rng.e.c;C++){const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];if(cell&&cell.t==='n'&&!(C===0&&R<=top+d.rows.length))cell.z='#,##0.00'}
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:top,c:0},e:{r:top+d.rows.length,c:ncol-1}})};
  return ws;
}
async function saveFile(filename,data,mime){
  const blob=new Blob([data],{type:mime});
  if(S.downloads){
    try{await S.downloads.save({filename,data:blob});return true}
    catch(e){const c=errCode(e);if(c==='declined')return true;if(c==='rate_limited'){toast('A download is already waiting for your answer.',true);return true}return false}
  }
  if(!S.downloads){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true}
  return false;
}
async function exportExcel(tabs){
  const all=computePayroll(),secs=tabs.map(t=>sectionData(t,payItems(all,t)));

  if(typeof XLSX!=='undefined'){
    const wb=XLSX.utils.book_new();

    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    if(await saveFile(base+'.xlsx',out,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'))return;
  }
  // Fallback: the same content as CSV text
  const esc=v=>{const s=String(v??'');return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const csv=secs.map(d=>[...d.hdr.map(t=>[t]),[],d.head,...d.rows,d.tot,...d.extra].map(r=>r.map(esc).join(',')).join('\n')).join('\n\n');
  toast('Excel export isn’t available here, so the payroll is offered as CSV.',true);
  offerFile(base+'.csv',csv);
}

const canUndo=()=>!!S.account&&S.account.role==='ADMIN'&&!S.viewAs&&!S.readOnly;
function undoCell(x){
  if(x.undone_at){resolveNames([x.undone_by]);return `<span class="chip">Undone</span><br><span class="muted small">${h(personName(x.undone_by))} · ${h(fmtStamp(x.undone_at))}</span>`}
  if(!x.undo)return '<span class="muted small">—</span>';
  return `<button class="btn sm" data-act="undoEntry" data-at="${h(x.at)}" data-action="${h(x.action)}">Undo</button>`;
