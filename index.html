async function undoEntry(btn){
  if(!canUndo()){toast('Only an Admin can undo changes.',true);return}
  const x=S.audit.find(e=>e.at===btn.dataset.at&&e.action===btn.dataset.action);if(!x||!x.undo)return;
  btn.disabled=true;btn.textContent='Checking…';
  const reset=()=>{btn.disabled=false;btn.textContent='Undo'};
  try{
    const main=await Store.get(cp('undo/')+x.undo);
    if(!main){toast('The saved “before” copy for this change is missing, so it can’t be undone.',true);reset();return}
    if(main.undone){toast('This change was already undone.',true);reset();return}
    let ops=(main.ops||[]).slice();
    for(let i=1;i<(main.parts||1);i++){const d=await Store.get(cp('undo/')+x.undo+'~'+i);if(!d){toast('Part of the saved copy is missing, so this can’t be undone.',true);reset();return}ops=ops.concat(d.ops||[])}
    const lockCache={},isLocked=async d=>{const k=cutoffFor(d).key;if(!(k in lockCache)){const doc=await Store.get(cp('payroll/')+k).catch(()=>null);lockCache[k]=!!(doc&&doc.status==='APPROVED')}return lockCache[k]};
    const todo=[],changed=[],locked=[];
    for(const op of ops){
      const cur=await Store.get(op.p);
      if(docPrint(plainDoc(cur))!==op.a){changed.push(op);continue}
      const wd=op.p.includes('dtr/')?((op.b||cur||{}).work_date):null;
      if(wd&&await isLocked(wd)){locked.push(op);continue}
      todo.push(op);
    }
    reset();
    resolveNames([x.by]);
    const who=personName(x.by)||x.by, rec=n=>`${n} ${n===1?'record':'records'}`;
    if(!todo.length){toast(`Nothing to undo: ${changed.length?rec(changed.length)+' changed again since':''}${changed.length&&locked.length?', ':''}${locked.length?rec(locked.length)+' in a locked cut-off':''}.`,true);return}
    const msg=`${rec(todo.length)} will go back to how ${todo.length===1?'it was':'they were'} before ${who} made this change on ${fmtStamp(x.at)}: ${todo.filter(o=>o.b==null).length?`${todo.filter(o=>o.b==null).length} added by it will be removed, `:''}${todo.filter(o=>o.b!=null).length} restored.${changed.length?` ${rec(changed.length)} changed again since and will be left as ${changed.length===1?'it is':'they are'}.`:''}${locked.length?` ${rec(locked.length)} in an approved, locked cut-off will be left as ${locked.length===1?'it is':'they are'} — reopen payroll first if those need undoing too.`:''}`;
    if(!(await confirmDlg(`Undo “${x.action}”?`,msg,'Undo change',true)))return;
    btn.disabled=true;btn.textContent='Undoing…';
    const jr=journal();let n=0;
    try{for(const op of todo){if(op.b==null)await jr.del(op.p);else await jr.set(op.p,op.b);n++}}catch(e){writeError(e)}
    if(!n){reset();return}
    const partial=n<ops.length;
    await Store.update(cp('undo/')+x.undo,{undone:true,undone_by:actor(),undone_at:nowISO(),undone_count:n}).catch(()=>{});
    await markAuditUndone(x);
    logAction('UNDO',x.entity,x.entity_id,`Undid ${x.action} by ${x.by} from ${fmtStamp(x.at)}: ${rec(n)} put back${partial?`, ${rec(ops.length-n)} left as they are`:''}${x.details?` (was: ${String(x.details).slice(0,160)})`:''}`,jr);
    toast(`Undone: ${rec(n)} put back${partial?` · ${rec(ops.length-n)} left as they are`:''}`);
  }catch(e){reset();writeError(e)}
}
function markAuditUndone(x){
  const path=cp('audit/'+x.at.slice(0,7)),by=actor(),at=nowISO();
  auditQueue=auditQueue.then(async()=>{
    try{const d=await Store.get(path);if(!d)return;const entries=(d.entries||[]).map(e=>e.at===x.at&&e.action===x.action&&e.by===x.by?{...e,undone_by:by,undone_at:at}:e);await Store.set(path,{entries})}catch(e){console.warn('audit',e)}
  });
  return auditQueue;
}
function pageAudit(){
  const months=[];let d=new Date();for(let i=0;i<6;i++){months.push(iso(d.getFullYear(),d.getMonth()+1,1).slice(0,7));d=new Date(d.getFullYear(),d.getMonth()-1,1)}
  const entries=[...S.audit].reverse();
  resolveNames(entries.map(x=>x.by));

async function saveSettings(form){
  const fd=new FormData(form),next={...S.settings};
  for(const[k,v]of fd.entries()){if(typeof DEFAULTS[k]==='number'){const x=Number(v);if(isNaN(x)){toast(`“${k}” must be a number.`,true);return}next[k]=x}else next[k]=String(v)}
  if(next.cutoff_day<2||next.cutoff_day>28){toast('The attendance month start day must be between 2 and 28.',true);return}
  if(next.cut1_end<1||next.cut1_end>=next.cutoff_day-1){toast('The 1st cut-off end day must be before the attendance month start day.',true);return}
  const save={};for(const k of Object.keys(DEFAULTS))save[k]=next[k];
  const jr=journal();
  try{await jr.set(cp('settings/main'),save);logAction('UPDATE','settings',null,'Payroll settings changed',jr);toast('Settings saved')}catch(e){writeError(e)}
}
async function saveDepartments(list,action,msg){
  const save={};for(const k of Object.keys(DEFAULTS))save[k]=S.settings[k];save.departments=list;
  const jr=journal();
  try{await jr.set(cp('settings/main'),save);logAction(action,'department',null,msg,jr);toast(msg)}catch(e){writeError(e)}
}
async function addDepartment(form){
  if(!can('settings')){toast('You don’t have access to change settings.',true);return}
  const name=String(new FormData(form).get('name')||'').replace(/\s+/g,' ').trim();
  if(!name){toast('Enter a department name.',true);return}
  if(DEPARTMENTS.some(d=>d.toLowerCase()===name.toLowerCase())){toast(`“${name}” already exists.`,true);return}
  await saveDepartments([...DEPARTMENTS,name],'ADD_DEPARTMENT',`Department added: ${name}`);form.reset();
}
async function removeDepartment(name){
  if(S.employees.some(e=>e.department===name)||S.accounts.some(a=>a.role==='DEPT_HEAD'&&a.department===name&&companiesOf(a).includes(S.company))){toast('This department still has employees or a department head. Move them first.',true);return}
  if(DEPARTMENTS.length<=1){toast('Keep at least one department.',true);return}
  if(!(await confirmDlg('Remove this department?',`${name} will no longer be offered for employees or department heads. Past records keep their department name.`,'Remove',true)))return;
  await saveDepartments(DEPARTMENTS.filter(d=>d!==name),'REMOVE_DEPARTMENT',`Department removed: ${name}`);
}

const pwOk=pw=>pw.length>=8&&/[A-Za-z]/.test(pw)&&/\d/.test(pw);
async function saveAcct(form){
  const fd=new FormData(form), ed=S.ui.acctEdit?allAccounts().find(a=>a.email===S.ui.acctEdit):null;
  const email=acctId(fd.get('email'));
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Enter a valid email address.',true);return}
  const oldEmail=ed?ed.email:null, changed=!!ed&&email!==oldEmail;
  const old=(S.accountDocs||[]).find(d=>d.email===email);
  const taken=allAccounts().some(a=>a.email===email)||!!old||(email===BOOT_ACCOUNT.email&&oldEmail!==BOOT_ACCOUNT.email);
  if((!ed||changed)&&taken){toast(old&&old.deleted?'This email belongs to a deleted account. Restore it under Account history instead.':(old&&old.moved_to?'This email was used before and is kept for the activity trail. Use a different email.':'An account with this email already exists.'),true);return}
  if(changed&&!(await confirmDlg('Change sign-in email?',`From ${oldEmail}\nTo ${email}\n\n${S.account&&oldEmail===S.account.email?'You':'This person'} will sign in with the new email from now on. The old email stops working, but its history stays in the Activity log.`,'Change email')))return;
  const roleV=ed&&ed.builtin?'ADMIN':fd.get('role'), dep=fd.get('department')||null, pw=fd.get('password')||'';
  if(roleV==='DEPT_HEAD'&&!dep){toast('Choose the department this head manages.',true);return}
  let cos;
  if(ed&&ed.builtin)cos=ALL_CO.slice();
  else{
    const mine=myCompanies(),prev=ed?companiesOf(ed):[];
    cos=ALL_CO.filter(id=>mine.includes(id)?fd.get('co_'+id)==='on':prev.includes(id));
    if(!cos.length){toast('Tick at least one company this account can open.',true);return}
  }
  if(pw&&!pwOk(pw)){toast('Password needs at least 8 characters with a letter and a number.',true);return}
  if(!ed&&!pw){toast('Set a password for the new account.',true);return}
  const doc={email,full_name:String(fd.get('full_name')||'').trim(),role:roleV,department:roleV==='DEPT_HEAD'?dep:null,
    active:ed&&ed.builtin?true:fd.get('active')!=='NO',main:!!(ed&&ed.builtin),companies:cos,updated_at:nowISO()};
  if(!(ed&&ed.builtin)&&roleV!=='ADMIN'&&fd.get('access_mode')==='custom'){const m={};for(const[k]of PERMS)m[k]=fd.get('p_'+k)==='on';doc.custom=true;doc.perms=withDeps(m)}
  else{doc.custom=false;doc.perms=null}
  if(pw)Object.assign(doc,await makeHash(pw));else{doc.salt=ed.salt;doc.iter=ed.iter;doc.hash=ed.hash}
  try{
    await Store.set('accounts/'+email,doc);
    if(changed){
      // Switch the signed-in session first so removing the old email doesn't sign this person out.
      if(S.account&&S.account.email===oldEmail){S.account={...S.account,email};saveSession(email)}
      const trail={moved_to:email,active:false,moved_at:nowISO(),moved_by:actor(),updated_at:nowISO()};
      if(oldEmail===BOOT_ACCOUNT.email&&!(S.accountDocs||[]).some(d=>d.email===BOOT_ACCOUNT.email))
        await Store.set('accounts/'+BOOT_ACCOUNT.email,{email:BOOT_ACCOUNT.email,full_name:ed.full_name||BOOT_ACCOUNT.full_name,role:'ADMIN',department:null,...trail});
      else await Store.update('accounts/'+acctId(oldEmail),trail);
      logAction('CHANGE_EMAIL','account',email,`${oldEmail} → ${email}`);
    }
    logAction(ed?'UPDATE_USER':'CREATE_USER','account',email,`${ROLES[roleV]}${doc.department?' · '+doc.department:''}${pw?' · password set':''}${doc.active?'':' · disabled'} · companies: ${coNames(cos)}${doc.custom?' · custom access: '+PERMS.filter(p=>doc.perms[p[0]]).map(p=>p[1]).join(', '):' · access same as role'}`);
    S.ui.acctForm=false;S.ui.acctEdit=null;toast(changed?'Email changed and account saved':'Account saved');scheduleRender();
  }catch(e){acctWriteError(e)}
}
async function deleteAcct(email){
  const a=allAccounts().find(x=>x.email===email);
  if(!a)return;
  if(a.builtin){toast('The main admin account can’t be deleted.',true);return}
  if(S.account&&a.email===S.account.email){toast('You can’t delete the account you’re signed in with.',true);return}

async function saveRoleAccess(form,reset){
  if(role()!=='ADMIN'){toast('Only an Admin can change access.',true);return}

    const m={};for(const[k]of PERMS)m[k]=reset?CAN[k].includes(r):fd.get(`${r}__${k}`)==='on';
    roles[r]=withDeps(m);

  for(const c of S.period.cuts){
    unsubPay.push(Store.watchDoc(cp('payroll/')+c.key,d=>{S.payDocs[c.n]=d;scheduleRender()},onSubErr));
    unsubPay.push(Store.watchDoc(cp('advances/')+c.key,d=>{S.adv[c.n]=(d&&d.items)||{};scheduleRender()},onSubErr));
  }
}
function watchAudit(){if(unsubAudit)unsubAudit();S.audit=[];unsubAudit=Store.watchDoc(cp('audit/')+S.auditMonth,d=>{S.audit=(d&&d.entries)||[];scheduleRender()},onSubErr)}
let unsubBase=[];
function startData(){
  stopData();
  S.period=monthPeriods(activeCut().ym);
  unsubBase.push(Store.watchCollection(cp('employees'),[],rows=>{S.employees=rows.map(r=>({...r,id:Number(r.id!=null?r.id:r._id)}));S.ready.employees=true;scheduleRender()},onSubErr));
  let periodSig=S.settings.cutoff_day+'/'+S.settings.cut1_end;
  unsubBase.push(Store.watchDoc(cp('settings/main'),d=>{
    S.settings={...coDefaults(),...(d||{})};syncDepartments();
    const sig=S.settings.cutoff_day+'/'+S.settings.cut1_end;
    if(sig!==periodSig){periodSig=sig;S.period=monthPeriods(S.period.ym);watchPeriod()}
    scheduleRender();
  },onSubErr));
  unsubBase.push(Store.watchCollection('accounts',[],rows=>{
    S.accountDocs=rows.map(r=>({email:r.email||r._id,full_name:r.full_name||'',role:r.role,department:r.department||null,moved_to:r.moved_to||null,moved_at:r.moved_at||null,moved_by:r.moved_by||null,deleted:!!r.deleted,deleted_at:r.deleted_at||null,deleted_by:r.deleted_by||null}));
    S.accounts=rows.filter(r=>!r.moved_to&&!r.deleted).map(r=>({email:r.email||r._id,full_name:r.full_name,role:r.role,department:r.department,active:r.active,updated_at:r.updated_at,salt:r.salt,iter:r.iter,hash:r.hash,main:!!r.main,custom:!!r.custom,perms:r.perms||null,companies:Array.isArray(r.companies)?r.companies:null}));
    const me=S.account&&S.accounts.find(a=>a.email===S.account.email);
    if(S.account&&!me&&!(acctId(S.account.email)===BOOT_ACCOUNT.email&&!(S.accountDocs||[]).some(d=>d.email===BOOT_ACCOUNT.email))){
      const em=S.account.email;findAccount(em).then(a=>{if(S.account&&S.account.email===em&&!a)signOut('Your account was removed or its sign-in email was changed. Please sign in again.')});
    }
    if(S.account&&me){
      if(me.active===false){signOut('Your account was disabled.');return}
      const nowCos=companiesOf(me);
      if(JSON.stringify(nowCos)!==JSON.stringify(myCompanies())){
        S.account={...S.account,companies:me.companies||null};brandSig='';
        if(!nowCos.length){signOut('Your account no longer has access to any company.');return}
        if(!nowCos.includes(S.company)){const nx=nowCos[0];setTimeout(()=>{toast('Your access to this company was removed.',true);switchCompany(nx)},0)}
      }
      if(JSON.stringify([me.custom,me.perms||null])!==JSON.stringify([S.account.custom,S.account.perms||null]))S.account={...S.account,custom:me.custom,perms:me.perms||null};
      if(me.role!==S.account.role||(me.department||null)!==S.account.department){S.account={...S.account,role:me.role,department:me.department||null,full_name:me.full_name||S.account.full_name};if(S.account.role!=='ADMIN')S.viewAs=null}
    }
    scheduleRender();
  },onSubErr));
  unsubBase.push(Store.watchDoc('settings/access',d=>{S.roleAccess=(d&&d.roles)||{};scheduleRender()},onSubErr));
  unsubBase.push(Store.watchCollection(cp('deadlines'),[],rows=>{const m={};for(const r of rows)m[r._id]=r;S.deadlines=m;scheduleRender()},onSubErr));
  unsubBase.push(Store.watchDoc(cp('audit/')+todayISO().slice(0,7),d=>{S.auditToday=(d&&d.entries)||[];scheduleRender()},onSubErr));
  watchPeriod();watchAudit();
}
function stopData(){
  for(const u of unsubBase)try{u()}catch(e){}unsubBase=[];
  if(unsubDtr){unsubDtr();unsubDtr=null}for(const u of unsubPay)try{u()}catch(e){}unsubPay=[];if(unsubAudit){unsubAudit();unsubAudit=null}
  S.employees=[];S.dtr=[];S.accounts=[];S.audit=[];S.payDocs={};S.adv={};S.deadlines={};S.auditToday=[];S.roleAccess={};S.ready={employees:false,dtr:false};
}

/* ---------------- Backup & restore (Admin) ---------------- */
const SCOPED_COLS=['employees','dtr','payroll','advances','deadlines','audit','settings'];
/* Backup covers user accounts plus every company the admin can open. Older backups (Prime Laundry only) still restore. */
function backupCols(){const cols=['accounts'];for(const id of myCompanies()){const c=coById(id);for(const x of SCOPED_COLS)cols.push(c.prefix+x)}return cols}
function colCompany(col){if(col==='accounts')return null;const c=COMPANIES.find(x=>x.prefix&&col.startsWith(x.prefix));if(c)return c.id;return col.startsWith('companies/')?'?':'prime'}
function lastBackup(){try{return localStorage.getItem('pl-last-backup')||''}catch(e){return''}}
function backupPanel(){
  if(role()!=='ADMIN'||S.viewAs)return'';
  const lb=lastBackup();
  return `<div class="panel"><h2>Backup &amp; restore</h2>
  <p class="muted small">Download everything stored for ${h(coNames(myCompanies()))} (employees and rates, attendance, approvals, advances, settings and the activity log of each company, plus user accounts) as one file. Restore loads such a file back, into this database or a new one. ${lb?`Last backup downloaded from this device: <b>${h(fmtStamp(lb))}</b>.`:'<b>No backup downloaded from this device yet.</b>'}</p>
  <div class="banner warn small" style="margin:0 0 12px">The backup file contains salaries and password hashes. Keep it private and store it somewhere safe.</div>
  <div class="row"><button class="btn primary" data-act="backupNow">Download backup</button>
  ${S.readOnly?'':`<label class="btn" style="cursor:pointer">Restore from file<input type="file" accept=".json,application/json" data-change="restoreFile" style="display:none"></label>`}</div>
  <p class="muted small" style="margin:10px 0 0">Restore adds and overwrites records from the file. It does not delete records that aren't in the file. Approved payroll cut-offs are restored as approved.</p></div>`;
}
async function backupNow(btn){
  if(role()!=='ADMIN'){toast('Only an Admin can download a backup.',true);return}
  btn.disabled=true;const old=btn.textContent;btn.textContent='Collecting data…';
  try{
    const data={};let docs=0;
    const cols=backupCols();
    for(const col of cols){const rows=await Store.getAll(col);data[col]=Object.fromEntries(rows);docs+=rows.length}
    const file={app:'prime-laundry-payroll-backup',version:2,created_at:nowISO(),created_by:actor(),companies:myCompanies(),collections:cols,documents:docs,data};
    const name=`payroll-backup-${myCompanies().length===ALL_CO.length?'all-companies':myCompanies().join('-')}-${nowISO().slice(0,10)}.json`;
    const ok=await saveFile(name,JSON.stringify(file),'application/json');
    if(!ok){offerFile(name,JSON.stringify(file));}
    try{localStorage.setItem('pl-last-backup',nowISO())}catch(e){}
    logAction('BACKUP','system',null,`${docs} records downloaded`);
    toast(`Backup ready: ${docs} records`);
  }catch(e){console.warn(e);toast('Could not read all data for the backup. Try again.',true)}
  btn.disabled=false;btn.textContent=old;scheduleRender();
}
async function restoreFromFile(input){
  const f=input.files&&input.files[0];if(!f)return;input.value='';
  if(role()!=='ADMIN'){toast('Only an Admin can restore a backup.',true);return}
  let file;
  try{file=JSON.parse(await f.text())}catch(e){toast('That file is not a valid backup.',true);return}
  if(!file||file.app!=='prime-laundry-payroll-backup'||!file.data){toast('That file is not a payroll backup from this system.',true);return}
  const items=[],mine=myCompanies();let skipped=0;
  for(const[col,docs]of Object.entries(file.data)){
    const co=colCompany(col);
    if(co==='?'||(co&&!mine.includes(co))){skipped+=Object.keys(docs||{}).length;continue}
    for(const[id,doc]of Object.entries(docs||{}))items.push([col+'/'+id,doc]);
  }
  if(skipped)toast(`${skipped} records belong to companies you can’t open and will be skipped.`,true);
  if(!items.length){toast('The backup file has no records you can restore.',true);return}
  const ok=await confirmDlg('Restore this backup?',`Backup made ${fmtStamp(file.created_at)} by ${file.created_by||'unknown'}\n${items.length} records\n\nRecords in the file will be added or will overwrite the current ones. Other records are kept. Do this only if you are sure.`,'Restore',true);
  if(!ok)return;
  let done=0,failed=0;const total=items.length;toast(`Restoring ${total} records…`);
  const queue=[...items];
  const worker=async()=>{while(queue.length){const[path,doc]=queue.shift();try{await Store.set(path,doc)}catch(e){failed++}done++;if(done%25===0)toast(`Restoring… ${done}/${total}`)}};
  await Promise.all(Array.from({length:6},worker));
  logAction('RESTORE','system',null,`${total-failed} of ${total} records restored from backup dated ${file.created_at||'?'}`);
  toast(failed?`Restored with ${failed} failures. Try again.`:`Restore complete: ${total} records`,!!failed);
  scheduleRender();
}
/* ---------------- Online setup (Firebase) ---------------- */
const CFG_KEY='pl-fb-cfg';
function getCfg(){
  const w=window.FIREBASE_CONFIG;if(w&&w.projectId)return w;
  try{const c=JSON.parse(localStorage.getItem(CFG_KEY)||'null');return c&&c.projectId?c:null}catch(e){return null}
}
function takeCfgFromLink(){
  const m=(location.hash||'').match(/cfg=([^&]+)/);if(!m)return;
  try{const c=JSON.parse(atob(decodeURIComponent(m[1])));if(c&&c.projectId)localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(e){}
  history.replaceState(null,'',location.pathname+'#dashboard');
}
function shareLink(){const c=getCfg();return c?location.origin+location.pathname+'#cfg='+encodeURIComponent(btoa(JSON.stringify(c))):''}
function parseFbConfig(t){
  const o={};for(const k of['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId']){const m=String(t).match(new RegExp(k+'\\s*[:=]\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]}
  return o.projectId&&o.apiKey&&o.appId?o:null;
}
function pageSetup(){
  return `<div class="login-wrap"><div class="login-card" style="width:min(560px,100%)">
  <h1>Connect your online database</h1>
  <p class="muted" style="margin:0">One-time setup. Paste the Firebase config here and the system will store everything online for all users.</p>
  <ol class="small" style="padding-left:18px;line-height:1.7">
    <li>Go to <b>console.firebase.google.com</b> → Create a project.</li>
    <li><b>Build → Firestore Database</b> → Create database (production mode).</li>
    <li>Firestore <b>Rules</b> tab → paste the rules shown below → Publish.</li>
    <li>Project settings (gear) → <b>Your apps</b> → web icon <b>&lt;/&gt;</b> → Register app → copy the <b>firebaseConfig</b> block and paste it here.</li>
  </ol>
  <details class="small"><summary>Rules to paste</summary><textarea rows="8" readonly>rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} { allow read, write: if true; }\n  }\n}</textarea></details>
  <form data-form="fbsetup" style="margin-top:12px">${S.ui.setupErr?`<div class="login-err">${h(S.ui.setupErr)}</div>`:''}
    <textarea name="cfg" rows="9" placeholder='const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  storageBucket: "...",\n  messagingSenderId: "...",\n  appId: "..."\n};' required></textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary">Connect</button><button type="button" class="btn" data-act="localOnly">Use on this browser only</button></div></form>
  <p class="muted small" style="margin:12px 0 0">After connecting and signing in, open <b>User accounts</b> to get a link that connects your team automatically.</p></div></div>`;
}
/* ---------------- Boot ---------------- */
async function boot(){
  netStatus();
  S.route=(location.hash||'#dashboard').slice(1);
  S.period=monthPeriods(activeCut().ym);
  if(!(window.crypto&&crypto.subtle)){S.mode='local';$('#view').innerHTML='<div class="empty"><b>This browser can’t run secure sign-in.</b>Open the page over https in an up-to-date browser.</div>';return}
  let db=null;
  takeCfgFromLink();
  const fc=getCfg();
  if(fc&&window.firebase){try{firebase.initializeApp(fc);db=firebase.firestore();Remote.db=db;Store=Remote;S.mode='shared'}catch(e){console.warn(e);db=null}}
  else if(window.claude&&typeof window.claude.use==='function'){try{db=await window.claude.use('db')}catch(e){db=null}}
  if(db){Remote.db=db;Store=Remote;S.mode='shared';if(!fc){try{S.downloads=await window.claude.use('downloads')}catch(e){}}}
  else if(sessionStorage.getItem('pl-local-ok')||localStorage.getItem('pl-local-ok')){Local.load();Store=Local;S.mode='local'}
  else{S.mode='setup';render();return}
  const sess=readSession();
  if(sess){const a=await findAccount(sess.email);const acc=a&&a.active!==false?publicAccount(a):null,cos=companiesOf(acc);if(acc&&cos.length){S.account=acc;S.company=pickCompany(acc.email,cos);S.settings=coDefaults();syncDepartments();saveSession(S.account.email);startData()}else clearSession()}
  render();
}
boot();
</script>
